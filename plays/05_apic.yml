---
# ============================================================
#  SGK_v5.docx Bölüm 5-7 – IBM API Connect Kurulumu
#
#  Kapsam:
#    1.  IBM Catalog Source (ibm-operator-catalog) eklenir
#    2.  APIC namespace + ibm-entitlement-key pull secret oluşturulur
#    3.  ibm-apiconnect operatörü kurulur (Subscription + InstallPlan onayı)
#    4.  APIConnectCluster top-level CR ile tüm subsystem'lar deploy edilir
#        (Management · Gateway · Portal · Analytics)
#    5.  Ready durumu beklenir, route + admin şifresi çıktılanır
#
#  IBM Dökümantasyonu:
#    https://www.ibm.com/docs/en/api-connect/software/10.0.8_lts
#    ?topic=installing-api-connect
#
#  Ön koşul:
#    - OCP cluster çalışıyor, kubeconfig erişilebilir
#    - IBM Entitlement Key hazır  →  myibm.ibm.com/products-services/containerlibrary
#    - all.yml'de apic_storage_class doğru ayarlı
#      (ODF yoksa: thin-csi,  ODF varsa: ocs-storagecluster-ceph-rbd)
#
#  Çalıştırma (site.yml üzerinden – önerilen):
#    ansible-playbook site.yml -i inventory/hosts.ini
#    → pull_secret ve apic_entitlement_key başlangıçta sorulur
#
#  Çalıştırma (bağımsız):
#    ansible-playbook plays/05_apic.yml -i inventory/hosts.ini \
#      -e "apic_entitlement_key=<IBM_ENTITLEMENT_KEY>"
# ============================================================
- name: "IBM API Connect Kurulumu – §5-7 SGK_v5"
  hosts: bastion
  become: true

  pre_tasks:
    # group_vars/all.yml'i hem standalone (plays/ dizininden) hem
    # import_playbook (proje kökünden) çalıştırmak için first_found kullanılır.
    - name: "group_vars/all.yml yükle"
      ansible.builtin.include_vars:
        file: "{{ lookup('first_found', [playbook_dir + '/group_vars/all.yml',
                                         playbook_dir + '/../group_vars/all.yml']) }}"

    # vars_prompt → import_playbook zincirinde apic_entitlement_key bazen taşınmaz.
    # Standalone çalıştırma için burada da sor (site.yml'den geliyorsa bu atlanır).
    - name: "IBM Entitlement Key tanımlı mı kontrol et"
      ansible.builtin.fail:
        msg: >-
          apic_entitlement_key tanımlı değil!
          Lütfen şu yöntemlerden biriyle sağlayın:
            1) site.yml üzerinden çalıştırın (vars_prompt ile sorulur)
            2) -e "apic_entitlement_key=<key>" ile geçirin
            3) group_vars/vault.yml içinde tanımlayın
      when: apic_entitlement_key is not defined or apic_entitlement_key | length == 0

  vars:
    kubeconfig_path: "{{ install_base_dir }}/ocp4/auth/kubeconfig"
    apic_manifests_dir: "{{ install_base_dir }}/apic-manifests"

  tasks:

    - name: "APIC manifest dizinini oluştur"
      ansible.builtin.file:
        path: "{{ apic_manifests_dir }}"
        state: directory
        mode: "0755"

    # ============================================================
    # ADIM 1 – IBM Catalog Source'ları
    #
    # 3 ayrı catalog source GitHub'daki sabit image digest'lerle apply edilir:
    #   - ibm-apiconnect-catalog     (case 5.12.0)
    #   - ibm-datapower-operator-catalog  (case 1.11.14)
    #   - opencloud-operators        (ibm-cp-common-services 4.6.22)
    # ============================================================

    - name: "ibm-apiconnect-catalog CatalogSource apply et"
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/oc apply --filename
          https://raw.githubusercontent.com/IBM/cloud-pak/master/repo/case/ibm-apiconnect/5.12.0/OLM/catalog-sources-linux-amd64.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: "ibm-datapower-operator-catalog CatalogSource apply et"
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/oc apply --filename
          https://raw.githubusercontent.com/IBM/cloud-pak/master/repo/case/ibm-datapower-operator/1.11.14/OLM/catalog-sources.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: "opencloud-operators CatalogSource apply et (ibm-cp-common-services)"
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/oc apply --filename
          https://raw.githubusercontent.com/IBM/cloud-pak/master/repo/case/ibm-cp-common-services/4.6.22/OLM/catalog-sources.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: "CatalogSource'ların READY olmasını bekle"
      ansible.builtin.shell: |
        /usr/local/bin/oc get catalogsource {{ item }} \
          -n openshift-marketplace \
          -o jsonpath={.status.connectionState.lastObservedState}
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: catalog_state
      until: catalog_state.stdout == "READY"
      retries: 30
      delay: 20
      changed_when: false
      loop:
        - ibm-apiconnect-catalog
        - ibm-datapower-operator-catalog
        - opencloud-operators

    - name: "CatalogSource durumları"
      ansible.builtin.debug:
        msg: "{{ item.item }}: {{ item.stdout }}"
      loop: "{{ catalog_state.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ============================================================
    # ADIM 2 – Namespace'ler + OperatorGroup + Pull Secret
    #
    # Oluşturulan namespace'ler:
    #   - apic                  → APIConnectCluster CR namespace'i
    #   - ibm-common-services   → ibm-common-service-operator namespace'i
    #
    # ibm-common-services namespace'i için OperatorGroup gerekli,
    # aksi halde OLM subscription'ı işleyemez.
    # Pull secret her namespace'e ayrı eklenir (cp.icr.io erişimi için).
    # ============================================================

    - name: "Namespace'leri oluştur (apic, ibm-common-services)"
      ansible.builtin.shell: |
        /usr/local/bin/oc create namespace {{ item }} \
          --dry-run=client -o yaml | /usr/local/bin/oc apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true
      loop:
        - "{{ apic_namespace }}"
        - ibm-common-services

    - name: "ibm-common-services OperatorGroup oluştur (AllNamespaces)"
      ansible.builtin.shell: |
        cat <<'EOF' | /usr/local/bin/oc apply -f -
        apiVersion: operators.coreos.com/v1
        kind: OperatorGroup
        metadata:
          name: ibm-common-services-operatorgroup
          namespace: ibm-common-services
        spec: {}
        EOF
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    # openshift-operators OCP varsayılan namespace'i — oc create'e gerek yok ama
    # diğer namespace'ler yeni oluşturulduğundan hepsini idempotent apply ile oluştur.
    - name: "Pull secret namespace'lerinin varlığını güvence altına al"
      ansible.builtin.shell: |
        /usr/local/bin/oc create namespace {{ item }} \
          --dry-run=client -o yaml | /usr/local/bin/oc apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true
      failed_when: false
      loop:
        - "{{ apic_namespace }}"
        - ibm-common-services
        - "{{ apic_operator_namespace }}"

    - name: "ibm-entitlement-key pull secret oluştur"
      ansible.builtin.shell: |
        /usr/local/bin/oc create secret docker-registry ibm-entitlement-key \
          --docker-server=cp.icr.io \
          --docker-username=cp \
          --docker-password="{{ apic_entitlement_key }}" \
          -n {{ item }} \
          --dry-run=client -o yaml | /usr/local/bin/oc apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true
      no_log: true
      register: pull_secret_result
      loop:
        - "{{ apic_namespace }}"
        - ibm-common-services
        - "{{ apic_operator_namespace }}"

    - name: "Pull secret oluşturma sonuçları (rc kontrolü)"
      ansible.builtin.fail:
        msg: >-
          ibm-entitlement-key secret oluşturulamadı (namespace: {{ item.item }}).
          Hata detayı için: oc get events -n {{ item.item }}
          İpucu: apic_entitlement_key değişkeninin doğru tanımlı olduğundan emin olun.
      when: item.rc != 0
      loop: "{{ pull_secret_result.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: "Pull secret'lar hazır"
      ansible.builtin.debug:
        msg: "ibm-entitlement-key → {{ apic_namespace }}, ibm-common-services, {{ apic_operator_namespace }}"

    # ============================================================
    # ADIM 3 – cert-manager Operatörü Kurulumu
    #
    # OCP 4.14+ built-in cert-manager yerine Red Hat cert-manager
    # operatörü kullanılır; APIC TLS sertifikalarını yönetir.
    # ============================================================

    - name: "cert-manager-operator namespace oluştur"
      ansible.builtin.shell: |
        /usr/local/bin/oc create namespace cert-manager-operator \
          --dry-run=client -o yaml | /usr/local/bin/oc apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: "cert-manager OperatorGroup manifesti yaz"
      ansible.builtin.copy:
        dest: "{{ apic_manifests_dir }}/02-cert-manager-operatorgroup.yaml"
        mode: "0644"
        content: |
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: cert-manager-operator
            namespace: cert-manager-operator
          spec:
            targetNamespaces:
              - cert-manager-operator

    - name: "cert-manager OperatorGroup oluştur"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc apply -f {{ apic_manifests_dir }}/02-cert-manager-operatorgroup.yaml"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: "cert-manager Subscription manifesti yaz"
      ansible.builtin.copy:
        dest: "{{ apic_manifests_dir }}/02-cert-manager-subscription.yaml"
        mode: "0644"
        content: |
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: openshift-cert-manager-operator
            namespace: cert-manager-operator
          spec:
            channel: stable-v1
            installPlanApproval: "{{ apic_install_plan_approval }}"
            name: openshift-cert-manager-operator
            source: redhat-operators
            sourceNamespace: openshift-marketplace

    - name: "cert-manager Subscription oluştur"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc apply -f {{ apic_manifests_dir }}/02-cert-manager-subscription.yaml"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: "cert-manager InstallPlan'ı bekle ve onayla"
      ansible.builtin.shell: |
        PENDING=$(/usr/local/bin/oc get installplan -n cert-manager-operator \
          -o jsonpath='{.items[?(@.spec.approved==false)].metadata.name}' 2>/dev/null)
        if [ -n "$PENDING" ]; then
          for ip in $PENDING; do
            /usr/local/bin/oc patch installplan "$ip" \
              -n cert-manager-operator --type merge \
              -p '{"spec":{"approved":true}}'
            echo "approved: $ip"
          done
        else
          echo "no_pending"
        fi
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: certmgr_ip_result
      until: >
        certmgr_ip_result.rc == 0 and
        ('approved:' in certmgr_ip_result.stdout or
         'no_pending' in certmgr_ip_result.stdout)
      retries: 20
      delay: 15
      changed_when: "'approved:' in certmgr_ip_result.stdout"
      when: apic_install_plan_approval == "Manual"

    - name: "cert-manager CSV'nin Succeeded olmasını bekle"
      ansible.builtin.shell: |
        PHASE=$(/usr/local/bin/oc get csv -n cert-manager-operator \
          -o jsonpath="{range .items[*]}{.metadata.name}{' '}{.status.phase}{'\n'}{end}" 2>/dev/null \
          | grep -i cert-manager | awk '{print $2}' | head -1)
        echo "${PHASE:-NotFound}"
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: certmgr_csv_status
      until: certmgr_csv_status.stdout == "Succeeded"
      retries: 40
      delay: 20
      changed_when: false

    - name: "cert-manager operatör durumu"
      ansible.builtin.debug:
        msg: "cert-manager CSV: {{ certmgr_csv_status.stdout }}"

    # ============================================================
    # ADIM 4 – ibm-apiconnect Operatörü Kurulumu
    #
    # ibm-apiconnect subscription'ı ibm-datapower-operator'ı
    # bağımlılık olarak otomatik çeker.
    # installPlanApproval: Manual ise her InstallPlan ayrıca onaylanır.
    # ============================================================

    - name: "ibm-apiconnect + common-services Subscription manifesti yaz"
      ansible.builtin.copy:
        dest: "{{ apic_manifests_dir }}/02-apic-subscription.yaml"
        mode: "0644"
        content: |
          ---
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: ibm-common-service-operator
            namespace: ibm-common-services
          spec:
            channel: "{{ common_services_channel }}"
            installPlanApproval: "{{ apic_install_plan_approval }}"
            name: ibm-common-service-operator
            source: opencloud-operators
            sourceNamespace: openshift-marketplace
          ---
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: ibm-apiconnect
            namespace: {{ apic_operator_namespace }}
          spec:
            channel: "{{ apic_catalog_channel }}"
            installPlanApproval: "{{ apic_install_plan_approval }}"
            name: ibm-apiconnect
            source: ibm-apiconnect-catalog
            sourceNamespace: openshift-marketplace

    - name: "ibm-apiconnect + common-services Subscription oluştur"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc apply -f {{ apic_manifests_dir }}/02-apic-subscription.yaml"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    # ── ibm-common-services InstallPlan onayı ────────────────────────────────
    - name: "ibm-common-services namespace'indeki bekleyen InstallPlan'ları onayla"
      ansible.builtin.shell: |
        PENDING=$(/usr/local/bin/oc get installplan -n ibm-common-services \
          -o jsonpath='{.items[?(@.spec.approved==false)].metadata.name}' 2>/dev/null)
        if [ -n "$PENDING" ]; then
          for ip in $PENDING; do
            /usr/local/bin/oc patch installplan "$ip" \
              -n ibm-common-services --type merge \
              -p '{"spec":{"approved":true}}'
            echo "approved: $ip"
          done
        else
          echo "no_pending"
        fi
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: cs_installplan_result
      until: >
        cs_installplan_result.rc == 0 and
        ('approved:' in cs_installplan_result.stdout or
         'no_pending' in cs_installplan_result.stdout)
      retries: 30
      delay: 20
      changed_when: "'approved:' in cs_installplan_result.stdout"
      when: apic_install_plan_approval == "Manual"

    # ── ibm-common-service-operator CSV Succeeded bekleme ────────────────────
    # APIC operatörü Common Services hazır olmadan başlayamaz.
    - name: "ibm-common-service-operator CSV'nin Succeeded olmasını bekle"
      ansible.builtin.shell: |
        PHASE=$(/usr/local/bin/oc get csv -n ibm-common-services \
          -o jsonpath="{range .items[*]}{.metadata.name}{' '}{.status.phase}{'\n'}{end}" 2>/dev/null \
          | grep ibm-common-service-operator | awk '{print $2}' | head -1)
        echo "${PHASE:-NotFound}"
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: cs_csv_status
      until: cs_csv_status.stdout == "Succeeded"
      retries: 40
      delay: 30
      changed_when: false

    - name: "ibm-common-service-operator durumu"
      ansible.builtin.debug:
        msg: "ibm-common-service-operator CSV: {{ cs_csv_status.stdout }}"

    # ── openshift-operators InstallPlan onayı ────────────────────────────────
    - name: "{{ apic_operator_namespace }} namespace'indeki tüm bekleyen InstallPlan'ları onayla"
      ansible.builtin.shell: |
        PENDING=$(/usr/local/bin/oc get installplan -n {{ apic_operator_namespace }} \
          -o jsonpath='{.items[?(@.spec.approved==false)].metadata.name}' 2>/dev/null)
        if [ -n "$PENDING" ]; then
          for ip in $PENDING; do
            /usr/local/bin/oc patch installplan "$ip" \
              -n {{ apic_operator_namespace }} --type merge \
              -p '{"spec":{"approved":true}}'
            echo "approved: $ip"
          done
        else
          echo "no_pending"
        fi
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: apic_installplan_result
      # InstallPlan henüz oluşmamış olabilir; oluşana kadar tekrar dene
      until: >
        apic_installplan_result.rc == 0 and
        ('approved:' in apic_installplan_result.stdout or
         'no_pending' in apic_installplan_result.stdout)
      retries: 30
      delay: 20
      changed_when: "'approved:' in apic_installplan_result.stdout"
      when: apic_install_plan_approval == "Manual"

    - name: "ibm-apiconnect CSV'nin Succeeded olmasını bekle"
      ansible.builtin.shell: |
        PHASE=$(/usr/local/bin/oc get csv -n {{ apic_operator_namespace }} \
          -o jsonpath="{range .items[*]}{.metadata.name}{' '}{.status.phase}{'\n'}{end}" 2>/dev/null \
          | grep ibm-apiconnect | awk '{print $2}' | head -1)
        echo "${PHASE:-NotFound}"
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: apic_csv_status
      until: apic_csv_status.stdout == "Succeeded"
      retries: 40
      delay: 30
      changed_when: false

    - name: "ibm-apiconnect operatör durumu"
      ansible.builtin.debug:
        msg: "ibm-apiconnect CSV: {{ apic_csv_status.stdout }}"

    - name: "ibm-apiconnect webhook pod'unun Ready olmasını bekle"
      ansible.builtin.shell: |
        /usr/local/bin/oc get pods -n {{ apic_operator_namespace }} \
          -o jsonpath="{range .items[*]}{.metadata.name}{' '}{range .status.conditions[?(@.type=='Ready')]}{.status}{end}{'\n'}{end}" 2>/dev/null \
          | grep ibm-apiconnect | grep True | wc -l
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: webhook_ready
      until: webhook_ready.stdout | trim | int >= 1
      retries: 20
      delay: 15
      changed_when: false

    # ============================================================
    # ADIM 4 – APIConnectCluster Top-Level CR
    #
    # Tek CR ile tüm subsystem'lar kurulur:
    #   Management · Gateway (DataPower) · Developer Portal · Analytics
    # ============================================================

    - name: "APIConnectCluster CR manifesti yaz"
      ansible.builtin.copy:
        dest: "{{ apic_manifests_dir }}/03-apiconnectcluster.yaml"
        mode: "0644"
        content: |
          apiVersion: apiconnect.ibm.com/v1beta1
          kind: APIConnectCluster
          metadata:
            name: {{ apic_instance_name }}
            namespace: {{ apic_namespace }}
            labels:
              app.kubernetes.io/instance: apiconnect
              app.kubernetes.io/managed-by: ibm-apiconnect
              app.kubernetes.io/name: {{ apic_instance_name }}
          spec:
            license:
              accept: true
              license: {{ apic_license_id }}
              metric: {{ apic_license_metric }}
              use: {{ apic_license_use }}
            profile: {{ apic_profile }}
            version: "{{ apic_version }}"
            storageClassName: {{ apic_storage_class }}

    - name: "APIConnectCluster CR oluştur"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc apply -f {{ apic_manifests_dir }}/03-apiconnectcluster.yaml"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: apic_cr_result
      until: apic_cr_result.rc == 0
      retries: 10
      delay: 15
      changed_when: apic_cr_result.rc == 0

    # apic namespace'indeki InstallPlan'lar da onaylanmalı (Manuel mod)
    - name: "{{ apic_namespace }} namespace'indeki InstallPlan'ları onayla"
      ansible.builtin.shell: |
        PENDING=$(/usr/local/bin/oc get installplan -n {{ apic_namespace }} \
          -o jsonpath='{.items[?(@.spec.approved==false)].metadata.name}' 2>/dev/null)
        if [ -n "$PENDING" ]; then
          for ip in $PENDING; do
            /usr/local/bin/oc patch installplan "$ip" \
              -n {{ apic_namespace }} --type merge \
              -p '{"spec":{"approved":true}}'
            echo "approved: $ip"
          done
        else
          echo "no_pending"
        fi
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: apic_ns_installplan
      until: >
        apic_ns_installplan.rc == 0 and
        ('approved:' in apic_ns_installplan.stdout or
         'no_pending' in apic_ns_installplan.stdout)
      retries: 20
      delay: 15
      changed_when: "'approved:' in apic_ns_installplan.stdout"
      when: apic_install_plan_approval == "Manual"

    # ============================================================
    # ADIM 5 – Ready Bekleme + Doğrulama
    # ============================================================

    - name: "APIConnectCluster başlangıç phase'i"
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/oc get apiconnectcluster {{ apic_instance_name }}
          -n {{ apic_namespace }}
          -o jsonpath={.status.phase}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: apic_initial_phase
      changed_when: false
      failed_when: false

    - name: "Başlangıç durumu"
      ansible.builtin.debug:
        msg: "APIConnectCluster phase: '{{ apic_initial_phase.stdout }}'"

    - name: "APIConnectCluster'ın Ready olmasını bekle (~30-60 dk)"
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/oc get apiconnectcluster {{ apic_instance_name }}
          -n {{ apic_namespace }}
          -o jsonpath={.status.phase}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: apic_phase
      until: apic_phase.stdout == "Ready"
      retries: 120
      delay: 30
      changed_when: false

    - name: "APIConnectCluster Ready ✓"
      ansible.builtin.debug:
        msg: "APIConnectCluster phase: {{ apic_phase.stdout }}"

    - name: "APIC route'larını listele"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc get routes -n {{ apic_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: apic_routes
      changed_when: false

    - name: "APIC route'ları"
      ansible.builtin.debug:
        var: apic_routes.stdout_lines

    - name: "Cloud Manager admin şifresini al"
      ansible.builtin.shell: |
        SECRET=$(/usr/local/bin/oc get secret -n {{ apic_namespace }} \
          -o jsonpath="{range .items[*]}{.metadata.name}{'\n'}{end}" 2>/dev/null \
          | grep mgmt-admin-pass | head -1)
        if [ -n "$SECRET" ]; then
          /usr/local/bin/oc get secret "$SECRET" \
            -n {{ apic_namespace }} \
            -o jsonpath="{.data.password}" | base64 -d && echo
        else
          echo "(henüz oluşmadı – oc get secret -n {{ apic_namespace }} | grep mgmt-admin-pass)"
        fi
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: apic_admin_pass
      changed_when: false

    - name: "Cloud Manager erişim bilgileri"
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "APIC Kurulumu Tamamlandı!"
          - "======================================================"
          - "URL:      mgmt-admin-apic route'una bakın"
          - "          oc get routes -n {{ apic_namespace }}"
          - "Kullanıcı: admin"
          - "Şifre:    {{ apic_admin_pass.stdout }}"
          - "======================================================"
