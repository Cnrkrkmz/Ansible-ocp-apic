---
# ============================================================
#  SGK_v5.docx Bölüm 5-7 – IBM API Connect Kurulumu
#
#  Kapsam:
#    1.  IBM Catalog Source (ibm-operator-catalog) eklenir
#    2.  APIC namespace + ibm-entitlement-key pull secret oluşturulur
#    3.  ibm-apiconnect operatörü kurulur (Subscription + InstallPlan onayı)
#    4.  APIConnectCluster top-level CR ile tüm subsystem'lar deploy edilir
#        (Management · Gateway · Portal · Analytics)
#    5.  Ready durumu beklenir, route + admin şifresi çıktılanır
#
#  IBM Dökümantasyonu:
#    https://www.ibm.com/docs/en/api-connect/software/10.0.8_lts
#    ?topic=installing-api-connect
#
#  Ön koşul:
#    - OCP cluster çalışıyor, kubeconfig erişilebilir
#    - IBM Entitlement Key hazır  →  myibm.ibm.com/products-services/containerlibrary
#    - all.yml'de apic_storage_class doğru ayarlı
#      (ODF yoksa: thin-csi,  ODF varsa: ocs-storagecluster-ceph-rbd)
#
#  Çalıştırma:
#    ansible-playbook plays/05_apic.yml -i inventory/hosts.ini \
#      -e "apic_entitlement_key=<IBM_ENTITLEMENT_KEY>"
# ============================================================
- name: "IBM API Connect Kurulumu – §5-7 SGK_v5"
  hosts: bastion
  become: true

  vars_prompt:
    - name: apic_entitlement_key
      prompt: >-
        IBM Entitlement Key
        (https://myibm.ibm.com/products-services/containerlibrary adresinden alın)
      private: true
      confirm: false

  pre_tasks:
    # group_vars/all.yml'i hem standalone (plays/ dizininden) hem
    # import_playbook (proje kökünden) çalıştırmak için first_found kullanılır.
    - name: "group_vars/all.yml yükle"
      ansible.builtin.include_vars:
        file: "{{ lookup('first_found', [playbook_dir + '/group_vars/all.yml',
                                         playbook_dir + '/../group_vars/all.yml']) }}"

  vars:
    kubeconfig_path: "{{ install_base_dir }}/ocp4/auth/kubeconfig"
    apic_manifests_dir: "{{ install_base_dir }}/apic-manifests"

  tasks:

    - name: "APIC manifest dizinini oluştur"
      ansible.builtin.file:
        path: "{{ apic_manifests_dir }}"
        state: directory
        mode: "0755"

    # ============================================================
    # ADIM 1 – IBM Operator Catalog Source
    # ============================================================

    - name: "ibm-operator-catalog CatalogSource manifesti yaz"
      ansible.builtin.copy:
        dest: "{{ apic_manifests_dir }}/01-ibm-catalog.yaml"
        mode: "0644"
        content: |
          apiVersion: operators.coreos.com/v1alpha1
          kind: CatalogSource
          metadata:
            name: ibm-operator-catalog
            namespace: openshift-marketplace
          spec:
            displayName: IBM Operator Catalog
            image: icr.io/cpopen/ibm-operator-catalog
            publisher: IBM
            sourceType: grpc
            updateStrategy:
              registryPoll:
                interval: 45m

    - name: "ibm-operator-catalog CatalogSource oluştur"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc apply -f {{ apic_manifests_dir }}/01-ibm-catalog.yaml"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: "ibm-operator-catalog READY olmasını bekle"
      ansible.builtin.shell: |
        /usr/local/bin/oc get catalogsource ibm-operator-catalog \
          -n openshift-marketplace \
          -o jsonpath={.status.connectionState.lastObservedState}
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: catalog_state
      until: catalog_state.stdout == "READY"
      retries: 30
      delay: 20
      changed_when: false

    - name: "IBM CatalogSource durumu"
      ansible.builtin.debug:
        msg: "ibm-operator-catalog: {{ catalog_state.stdout }}"

    # ============================================================
    # ADIM 2 – APIC Namespace + ibm-entitlement-key Pull Secret
    #
    # Pull secret operatör Subscription'larından ÖNCE oluşturulmalı.
    # Hem apic namespace'i hem de operatörün kurulduğu namespace
    # cp.icr.io'ya erişmek için bu secret'a ihtiyaç duyar.
    # ============================================================

    - name: "APIC namespace oluştur"
      ansible.builtin.shell: |
        /usr/local/bin/oc create namespace {{ apic_namespace }} \
          --dry-run=client -o yaml | /usr/local/bin/oc apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: "ibm-entitlement-key pull secret – {{ apic_namespace }}"
      ansible.builtin.shell: |
        /usr/local/bin/oc create secret docker-registry ibm-entitlement-key \
          --docker-server=cp.icr.io \
          --docker-username=cp \
          --docker-password="{{ apic_entitlement_key }}" \
          -n {{ apic_namespace }} \
          --dry-run=client -o yaml | /usr/local/bin/oc apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true
      no_log: true

    - name: "ibm-entitlement-key pull secret – {{ apic_operator_namespace }}"
      ansible.builtin.shell: |
        /usr/local/bin/oc create secret docker-registry ibm-entitlement-key \
          --docker-server=cp.icr.io \
          --docker-username=cp \
          --docker-password="{{ apic_entitlement_key }}" \
          -n {{ apic_operator_namespace }} \
          --dry-run=client -o yaml | /usr/local/bin/oc apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true
      no_log: true

    - name: "Pull secret'lar hazır"
      ansible.builtin.debug:
        msg: "ibm-entitlement-key → {{ apic_namespace }}, {{ apic_operator_namespace }}"

    # ============================================================
    # ADIM 3 – cert-manager Operatörü Kurulumu
    #
    # OCP 4.14+ built-in cert-manager yerine Red Hat cert-manager
    # operatörü kullanılır; APIC TLS sertifikalarını yönetir.
    # ============================================================

    - name: "cert-manager-operator namespace oluştur"
      ansible.builtin.shell: |
        /usr/local/bin/oc create namespace cert-manager-operator \
          --dry-run=client -o yaml | /usr/local/bin/oc apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: "cert-manager OperatorGroup manifesti yaz"
      ansible.builtin.copy:
        dest: "{{ apic_manifests_dir }}/02-cert-manager-operatorgroup.yaml"
        mode: "0644"
        content: |
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: cert-manager-operator
            namespace: cert-manager-operator
          spec:
            targetNamespaces:
              - cert-manager-operator

    - name: "cert-manager OperatorGroup oluştur"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc apply -f {{ apic_manifests_dir }}/02-cert-manager-operatorgroup.yaml"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: "cert-manager Subscription manifesti yaz"
      ansible.builtin.copy:
        dest: "{{ apic_manifests_dir }}/02-cert-manager-subscription.yaml"
        mode: "0644"
        content: |
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: openshift-cert-manager-operator
            namespace: cert-manager-operator
          spec:
            channel: stable-v1
            installPlanApproval: "{{ apic_install_plan_approval }}"
            name: openshift-cert-manager-operator
            source: redhat-operators
            sourceNamespace: openshift-marketplace

    - name: "cert-manager Subscription oluştur"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc apply -f {{ apic_manifests_dir }}/02-cert-manager-subscription.yaml"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: "cert-manager InstallPlan'ı bekle ve onayla"
      ansible.builtin.shell: |
        PENDING=$(/usr/local/bin/oc get installplan -n cert-manager-operator \
          -o jsonpath='{.items[?(@.spec.approved==false)].metadata.name}' 2>/dev/null)
        if [ -n "$PENDING" ]; then
          for ip in $PENDING; do
            /usr/local/bin/oc patch installplan "$ip" \
              -n cert-manager-operator --type merge \
              -p '{"spec":{"approved":true}}'
            echo "approved: $ip"
          done
        else
          echo "no_pending"
        fi
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: certmgr_ip_result
      until: >
        certmgr_ip_result.rc == 0 and
        ('approved:' in certmgr_ip_result.stdout or
         'no_pending' in certmgr_ip_result.stdout)
      retries: 20
      delay: 15
      changed_when: "'approved:' in certmgr_ip_result.stdout"
      when: apic_install_plan_approval == "Manual"

    - name: "cert-manager CSV'nin Succeeded olmasını bekle"
      ansible.builtin.shell: |
        # CSV cert-manager-operator veya openshift-operators namespace'inde olabilir
        PHASE=$( (
          /usr/local/bin/oc get csv -n cert-manager-operator \
            --no-headers \
            -o custom-columns='NAME:.metadata.name,PHASE:.status.phase' 2>/dev/null
          /usr/local/bin/oc get csv -n openshift-operators \
            --no-headers \
            -o custom-columns='NAME:.metadata.name,PHASE:.status.phase' 2>/dev/null
        ) | grep -i 'cert-manager' | awk '{print $2}' | head -1)
        echo "${PHASE:-NotFound}"
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: certmgr_csv_status
      until: certmgr_csv_status.stdout == "Succeeded"
      retries: 40
      delay: 20
      changed_when: false

    - name: "cert-manager operatör durumu"
      ansible.builtin.debug:
        msg: "cert-manager CSV: {{ certmgr_csv_status.stdout }}"

    # ============================================================
    # ADIM 4 – ibm-apiconnect Operatörü Kurulumu
    #
    # ibm-apiconnect subscription'ı ibm-datapower-operator'ı
    # bağımlılık olarak otomatik çeker.
    # installPlanApproval: Manual ise her InstallPlan ayrıca onaylanır.
    # ============================================================

    - name: "ibm-apiconnect Subscription manifesti yaz"
      ansible.builtin.copy:
        dest: "{{ apic_manifests_dir }}/02-apic-subscription.yaml"
        mode: "0644"
        content: |
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: ibm-apiconnect
            namespace: {{ apic_operator_namespace }}
          spec:
            channel: "{{ apic_catalog_channel }}"
            installPlanApproval: "{{ apic_install_plan_approval }}"
            name: ibm-apiconnect
            source: ibm-operator-catalog
            sourceNamespace: openshift-marketplace

    - name: "ibm-apiconnect Subscription oluştur"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc apply -f {{ apic_manifests_dir }}/02-apic-subscription.yaml"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: "{{ apic_operator_namespace }} namespace'indeki tüm bekleyen InstallPlan'ları onayla"
      ansible.builtin.shell: |
        PENDING=$(/usr/local/bin/oc get installplan -n {{ apic_operator_namespace }} \
          -o jsonpath='{.items[?(@.spec.approved==false)].metadata.name}' 2>/dev/null)
        if [ -n "$PENDING" ]; then
          for ip in $PENDING; do
            /usr/local/bin/oc patch installplan "$ip" \
              -n {{ apic_operator_namespace }} --type merge \
              -p '{"spec":{"approved":true}}'
            echo "approved: $ip"
          done
        else
          echo "no_pending"
        fi
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: apic_installplan_result
      # InstallPlan henüz oluşmamış olabilir; oluşana kadar tekrar dene
      until: >
        apic_installplan_result.rc == 0 and
        ('approved:' in apic_installplan_result.stdout or
         'no_pending' in apic_installplan_result.stdout)
      retries: 30
      delay: 20
      changed_when: "'approved:' in apic_installplan_result.stdout"
      when: apic_install_plan_approval == "Manual"

    - name: "ibm-apiconnect CSV'nin Succeeded olmasını bekle"
      ansible.builtin.shell: |
        /usr/local/bin/oc get csv -n {{ apic_operator_namespace }} \
          --no-headers \
          -o custom-columns='NAME:.metadata.name,PHASE:.status.phase' \
          | grep 'ibm-apiconnect' | awk '{print $2}'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: apic_csv_status
      until: "'Succeeded' in apic_csv_status.stdout"
      retries: 40
      delay: 30
      changed_when: false

    - name: "ibm-apiconnect operatör durumu"
      ansible.builtin.debug:
        msg: "ibm-apiconnect CSV: {{ apic_csv_status.stdout }}"

    # ============================================================
    # ADIM 4 – APIConnectCluster Top-Level CR
    #
    # Tek CR ile tüm subsystem'lar kurulur:
    #   Management · Gateway (DataPower) · Developer Portal · Analytics
    # ============================================================

    - name: "APIConnectCluster CR manifesti yaz"
      ansible.builtin.copy:
        dest: "{{ apic_manifests_dir }}/03-apiconnectcluster.yaml"
        mode: "0644"
        content: |
          apiVersion: apiconnect.ibm.com/v1beta1
          kind: APIConnectCluster
          metadata:
            name: {{ apic_instance_name }}
            namespace: {{ apic_namespace }}
            labels:
              app.kubernetes.io/instance: apiconnect
              app.kubernetes.io/managed-by: ibm-apiconnect
              app.kubernetes.io/name: {{ apic_instance_name }}
          spec:
            license:
              accept: true
              license: {{ apic_license_id }}
              metric: {{ apic_license_metric }}
              use: {{ apic_license_use }}
            profile: {{ apic_profile }}
            storageClassName: {{ apic_storage_class }}

    - name: "APIConnectCluster CR oluştur"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc apply -f {{ apic_manifests_dir }}/03-apiconnectcluster.yaml"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    # apic namespace'indeki InstallPlan'lar da onaylanmalı (Manuel mod)
    - name: "{{ apic_namespace }} namespace'indeki InstallPlan'ları onayla"
      ansible.builtin.shell: |
        PENDING=$(/usr/local/bin/oc get installplan -n {{ apic_namespace }} \
          -o jsonpath='{.items[?(@.spec.approved==false)].metadata.name}' 2>/dev/null)
        if [ -n "$PENDING" ]; then
          for ip in $PENDING; do
            /usr/local/bin/oc patch installplan "$ip" \
              -n {{ apic_namespace }} --type merge \
              -p '{"spec":{"approved":true}}'
            echo "approved: $ip"
          done
        else
          echo "no_pending"
        fi
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: apic_ns_installplan
      until: >
        apic_ns_installplan.rc == 0 and
        ('approved:' in apic_ns_installplan.stdout or
         'no_pending' in apic_ns_installplan.stdout)
      retries: 20
      delay: 15
      changed_when: "'approved:' in apic_ns_installplan.stdout"
      when: apic_install_plan_approval == "Manual"

    # ============================================================
    # ADIM 5 – Ready Bekleme + Doğrulama
    # ============================================================

    - name: "APIConnectCluster başlangıç phase'i"
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/oc get apiconnectcluster {{ apic_instance_name }}
          -n {{ apic_namespace }}
          -o jsonpath={.status.phase}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: apic_initial_phase
      changed_when: false
      failed_when: false

    - name: "Başlangıç durumu"
      ansible.builtin.debug:
        msg: "APIConnectCluster phase: '{{ apic_initial_phase.stdout }}'"

    - name: "APIConnectCluster'ın Ready olmasını bekle (~30-60 dk)"
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/oc get apiconnectcluster {{ apic_instance_name }}
          -n {{ apic_namespace }}
          -o jsonpath={.status.phase}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: apic_phase
      until: apic_phase.stdout == "Ready"
      retries: 120
      delay: 30
      changed_when: false

    - name: "APIConnectCluster Ready ✓"
      ansible.builtin.debug:
        msg: "APIConnectCluster phase: {{ apic_phase.stdout }}"

    - name: "APIC route'larını listele"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc get routes -n {{ apic_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: apic_routes
      changed_when: false

    - name: "APIC route'ları"
      ansible.builtin.debug:
        var: apic_routes.stdout_lines

    - name: "Cloud Manager admin şifresini al"
      ansible.builtin.shell: |
        SECRET=$(/usr/local/bin/oc get secret -n {{ apic_namespace }} \
          --no-headers -o custom-columns='NAME:.metadata.name' \
          | grep 'mgmt-admin-pass' | head -1)
        if [ -n "$SECRET" ]; then
          /usr/local/bin/oc get secret "$SECRET" \
            -n {{ apic_namespace }} \
            -o jsonpath="{.data.password}" | base64 -d && echo
        else
          echo "(henüz oluşmadı – oc get secret -n {{ apic_namespace }} | grep mgmt-admin-pass)"
        fi
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: apic_admin_pass
      changed_when: false

    - name: "Cloud Manager erişim bilgileri"
      ansible.builtin.debug:
        msg:
          - "======================================================"
          - "APIC Kurulumu Tamamlandı!"
          - "======================================================"
          - "URL:      mgmt-admin-apic route'una bakın"
          - "          oc get routes -n {{ apic_namespace }}"
          - "Kullanıcı: admin"
          - "Şifre:    {{ apic_admin_pass.stdout }}"
          - "======================================================"
