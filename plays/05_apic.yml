---
# ============================================================
#  SGK_v5.docx Bölüm 5-7 – IBM CP4I Catalog + APIC Kurulumu
#
#  Kapsam:
#    §5.1  IBM Catalog Source'larının eklenmesi
#    §5.2  Operatörlerin kurulması (cert-manager, foundational
#          services, CP4I, APIC, DataPower)
#    §5.3  IBM Entitlement Key – image pull secret
#    §7    APIConnectCluster (top-level CR) ile APIC kurulumu
#
#  IBM Dökümantasyonu:
#    https://www.ibm.com/docs/en/cloud-paks/cp-integration/16.1.0
#    ?topic=images-adding-catalog-sources-openshift-cluster
#
#  Ön koşul:
#    - OCP cluster hazır ve kubeconfig erişilebilir
#    - IBM Entitlement Key mevcut (vars_prompt veya -e ile)
#    - apic_storage_class değişkeni all.yml'de doğru ayarlı
#      (ODF hazırsa: ocs-storagecluster-ceph-rbd, değilse: thin-csi)
#
#  Çalıştırma:
#    ansible-playbook plays/05_apic.yml -i inventory/hosts.ini \
#      -e "apic_entitlement_key=<IBM_ENTITLEMENT_KEY>"
# ============================================================
- name: "CP4I Catalog + APIC Kurulumu – §5-7 SGK_v5"
  hosts: bastion
  become: true

  vars_prompt:
    - name: apic_entitlement_key
      prompt: >-
        IBM Entitlement Key
        (https://myibm.ibm.com/products-services/containerlibrary adresinden alın)
      private: true
      confirm: false

  pre_tasks:
    # group_vars/all.yml'i hem standalone (plays/ dizininden) hem
    # import_playbook (proje kökünden) çalıştırmak için first_found kullanılır.
    - name: "group_vars/all.yml yükle"
      ansible.builtin.include_vars:
        file: "{{ lookup('first_found', [playbook_dir + '/group_vars/all.yml', playbook_dir + '/../group_vars/all.yml']) }}"

  vars:
    kubeconfig_path: "{{ install_base_dir }}/ocp4/auth/kubeconfig"
    apic_manifests_dir: "{{ install_base_dir }}/apic-manifests"

  tasks:

    - name: "APIC manifest dizinini oluştur"
      ansible.builtin.file:
        path: "{{ apic_manifests_dir }}"
        state: directory
        mode: "0755"

    # ============================================================
    # ADIM 24 – IBM Catalog Source'larının Eklenmesi  (§5.1 SGK_v5)
    #
    # Gerekli kataloglar:
    #   - IBM Cloud Pak for Integration
    #   - IBM API Connect
    #   - IBM DataPower Gateway
    #   - IBM Cloud Pak foundational services
    # ============================================================

    - name: "IBM CatalogSource manifesti yaz"
      ansible.builtin.copy:
        dest: "{{ apic_manifests_dir }}/01-ibm-catalogs.yaml"
        mode: "0644"
        content: |
          ---
          apiVersion: operators.coreos.com/v1alpha1
          kind: CatalogSource
          metadata:
            name: ibm-operator-catalog
            namespace: openshift-marketplace
          spec:
            displayName: IBM Operator Catalog
            image: icr.io/cpopen/ibm-operator-catalog
            publisher: IBM
            sourceType: grpc
            updateStrategy:
              registryPoll:
                interval: 45m
          ---
          apiVersion: operators.coreos.com/v1alpha1
          kind: CatalogSource
          metadata:
            name: opencloud-operators
            namespace: openshift-marketplace
          spec:
            displayName: IBMCS Operators
            image: icr.io/cpopen/ibm-common-service-catalog:latest
            publisher: IBM
            sourceType: grpc
            updateStrategy:
              registryPoll:
                interval: 45m

    - name: "IBM CatalogSource'larını oluştur"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc apply -f {{ apic_manifests_dir }}/01-ibm-catalogs.yaml"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: "IBM CatalogSource'larının hazır olmasını bekle"
      ansible.builtin.shell: |
        /usr/local/bin/oc get catalogsource ibm-operator-catalog \
          -n openshift-marketplace \
          -o jsonpath={.status.connectionState.lastObservedState}
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: catalog_status
      until: catalog_status.stdout == "READY"
      retries: 30
      delay: 20
      changed_when: false

    - name: "IBM CatalogSource durumu"
      ansible.builtin.debug:
        msg: "ibm-operator-catalog durumu: {{ catalog_status.stdout }}"

    # ============================================================
    # ADIM 25 – Operatörlerin Kurulması  (§5.2 SGK_v5)
    #
    # Kurulacak 5 operatör (sırayla):
    #   1. cert-manager (Red Hat built-in)
    #   2. IBM Cloud Pak foundational services
    #   3. IBM Cloud Pak for Integration
    #   4. IBM API Connect
    #   5. IBM DataPower Gateway (APIC ile otomatik gelir)
    # ============================================================

    - name: "cert-manager Subscription manifesti yaz"
      ansible.builtin.copy:
        dest: "{{ apic_manifests_dir }}/02-cert-manager-subscription.yaml"
        mode: "0644"
        content: |
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: openshift-cert-manager-operator
            namespace: cert-manager-operator
          spec:
            channel: stable-v1
            installPlanApproval: "{{ apic_install_plan_approval }}"
            name: openshift-cert-manager-operator
            source: redhat-operators
            sourceNamespace: openshift-marketplace

    - name: "cert-manager namespace oluştur"
      ansible.builtin.shell: |
        /usr/local/bin/oc create namespace cert-manager-operator --dry-run=client -o yaml \
          | /usr/local/bin/oc apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: "cert-manager OperatorGroup oluştur"
      ansible.builtin.shell: |
        cat <<'EOF' | /usr/local/bin/oc apply -f -
        apiVersion: operators.coreos.com/v1
        kind: OperatorGroup
        metadata:
          name: cert-manager-operator
          namespace: cert-manager-operator
        spec:
          targetNamespaces:
            - cert-manager-operator
        EOF
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: "cert-manager Subscription oluştur"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc apply -f {{ apic_manifests_dir }}/02-cert-manager-subscription.yaml"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: "IBM foundational services + CP4I + APIC Subscription manifestleri yaz"
      ansible.builtin.copy:
        dest: "{{ apic_manifests_dir }}/03-ibm-operator-subscriptions.yaml"
        mode: "0644"
        content: |
          ---
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: ibm-common-service-operator
            namespace: openshift-operators
          spec:
            channel: v4.6
            installPlanApproval: "{{ apic_install_plan_approval }}"
            name: ibm-common-service-operator
            source: opencloud-operators
            sourceNamespace: openshift-marketplace
          ---
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: ibm-integration-platform-navigator
            namespace: openshift-operators
          spec:
            channel: "{{ cp4i_catalog_channel }}"
            installPlanApproval: "{{ apic_install_plan_approval }}"
            name: ibm-integration-platform-navigator
            source: ibm-operator-catalog
            sourceNamespace: openshift-marketplace
          ---
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: ibm-apiconnect
            namespace: "{{ apic_operator_namespace }}"
          spec:
            channel: "{{ apic_catalog_channel }}"
            installPlanApproval: "{{ apic_install_plan_approval }}"
            name: ibm-apiconnect
            source: ibm-operator-catalog
            sourceNamespace: openshift-marketplace

    - name: "IBM operatör Subscription'larını oluştur"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc apply -f {{ apic_manifests_dir }}/03-ibm-operator-subscriptions.yaml"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    # Manual approval modunda InstallPlan'ları onayla
    - name: "cert-manager InstallPlan'ı bekle ve onayla"
      ansible.builtin.shell: |
        IP=$(/usr/local/bin/oc get installplan -n cert-manager-operator \
          -o jsonpath='{.items[?(@.spec.approved==false)].metadata.name}' 2>/dev/null | head -1)
        if [ -n "$IP" ]; then
          /usr/local/bin/oc patch installplan "$IP" \
            -n cert-manager-operator --type merge \
            -p '{"spec":{"approved":true}}'
          echo "approved: $IP"
        else
          echo "already_approved_or_automatic"
        fi
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: certmgr_ip_result
      until: certmgr_ip_result.rc == 0
      retries: 20
      delay: 15
      changed_when: "'approved:' in certmgr_ip_result.stdout"
      when: apic_install_plan_approval == "Manual"

    - name: "openshift-operators InstallPlan'larını onayla (ibm-apiconnect dahil)"
      ansible.builtin.shell: |
        for ip in $(/usr/local/bin/oc get installplan -n {{ apic_operator_namespace }} \
          -o jsonpath='{.items[?(@.spec.approved==false)].metadata.name}' 2>/dev/null); do
          /usr/local/bin/oc patch installplan "$ip" \
            -n {{ apic_operator_namespace }} --type merge \
            -p '{"spec":{"approved":true}}'
          echo "approved: $ip"
        done
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: operators_ip_result
      until: operators_ip_result.rc == 0
      retries: 30
      delay: 20
      changed_when: "'approved:' in operators_ip_result.stdout"
      when: apic_install_plan_approval == "Manual"

    - name: "ibm-apiconnect CSV'nin Succeeded olmasını bekle"
      ansible.builtin.shell: |
        /usr/local/bin/oc get csv -n {{ apic_operator_namespace }} \
          --no-headers \
          -o custom-columns='NAME:.metadata.name,PHASE:.status.phase' \
          | grep 'ibm-apiconnect' | awk '{print $2}'
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: apic_csv_status
      until: "'Succeeded' in apic_csv_status.stdout"
      retries: 40
      delay: 30
      changed_when: false

    - name: "ibm-apiconnect CSV durumu"
      ansible.builtin.debug:
        msg: "IBM API Connect CSV: {{ apic_csv_status.stdout }}"

    # ============================================================
    # ADIM 26 – IBM Entitlement Key Pull Secret  (§5.3 SGK_v5)
    #
    # apic namespace ve openshift-operators namespace'lerine
    # ayrı ayrı image pull secret oluşturulur.
    # ============================================================

    - name: "APIC namespace oluştur"
      ansible.builtin.shell: |
        /usr/local/bin/oc create namespace {{ apic_namespace }} \
          --dry-run=client -o yaml | /usr/local/bin/oc apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: "ibm-entitlement-key secret'ını oluştur – {{ apic_namespace }}"
      ansible.builtin.shell: |
        /usr/local/bin/oc create secret docker-registry ibm-entitlement-key \
          --docker-server=cp.icr.io \
          --docker-username=cp \
          --docker-password="{{ apic_entitlement_key }}" \
          -n {{ apic_namespace }} \
          --dry-run=client -o yaml | /usr/local/bin/oc apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true
      no_log: true

    - name: "ibm-entitlement-key secret'ını oluştur – {{ apic_operator_namespace }}"
      ansible.builtin.shell: |
        /usr/local/bin/oc create secret docker-registry ibm-entitlement-key \
          --docker-server=cp.icr.io \
          --docker-username=cp \
          --docker-password="{{ apic_entitlement_key }}" \
          -n {{ apic_operator_namespace }} \
          --dry-run=client -o yaml | /usr/local/bin/oc apply -f -
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true
      no_log: true

    # ============================================================
    # ADIM 27 – APIConnectCluster Top-Level CR  (§7 SGK_v5)
    #
    # IBM Dökümantasyonu:
    #   https://www.ibm.com/docs/en/api-connect/software/10.0.8_lts
    #   ?topic=installing-api-connect
    #
    # Top-level CR ile tüm subsystem'lar tek seferde kurulur:
    #   - Management
    #   - Developer Portal
    #   - Gateway (DataPower)
    #   - Analytics
    # ============================================================

    - name: "APIConnectCluster CR manifesti yaz (version belirtilmeden)"
      ansible.builtin.copy:
        dest: "{{ apic_manifests_dir }}/04-apiconnectcluster.yaml"
        mode: "0644"
        content: |
          apiVersion: apiconnect.ibm.com/v1beta1
          kind: APIConnectCluster
          metadata:
            name: {{ apic_instance_name }}
            namespace: {{ apic_namespace }}
            labels:
              app.kubernetes.io/instance: apiconnect
              app.kubernetes.io/managed-by: ibm-apiconnect
              app.kubernetes.io/name: {{ apic_instance_name }}
          spec:
            license:
              accept: true
              license: {{ apic_license_id }}
              metric: {{ apic_license_metric }}
              use: {{ apic_license_use }}
            profile: {{ apic_profile }}
            storageClassName: {{ apic_storage_class }}
      when: apic_version | length == 0

    - name: "APIConnectCluster CR manifesti yaz (version ile)"
      ansible.builtin.copy:
        dest: "{{ apic_manifests_dir }}/04-apiconnectcluster.yaml"
        mode: "0644"
        content: |
          apiVersion: apiconnect.ibm.com/v1beta1
          kind: APIConnectCluster
          metadata:
            name: {{ apic_instance_name }}
            namespace: {{ apic_namespace }}
            labels:
              app.kubernetes.io/instance: apiconnect
              app.kubernetes.io/managed-by: ibm-apiconnect
              app.kubernetes.io/name: {{ apic_instance_name }}
          spec:
            license:
              accept: true
              license: {{ apic_license_id }}
              metric: {{ apic_license_metric }}
              use: {{ apic_license_use }}
            profile: {{ apic_profile }}
            version: "{{ apic_version }}"
            storageClassName: {{ apic_storage_class }}
      when: apic_version | length > 0

    - name: "APIConnectCluster CR oluştur"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc apply -f {{ apic_manifests_dir }}/04-apiconnectcluster.yaml"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: "APIConnectCluster oluşturuldu – başlangıç durumu"
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/oc get apiconnectcluster {{ apic_instance_name }}
          -n {{ apic_namespace }}
          -o jsonpath={.status.phase}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: apic_initial_phase
      changed_when: false
      failed_when: false

    - name: "APIConnectCluster başlangıç durumu"
      ansible.builtin.debug:
        msg: "APIConnectCluster başlangıç phase: '{{ apic_initial_phase.stdout }}'"

    - name: "APIConnectCluster'ın Ready durumuna geçmesini bekle (~30-60 dk)"
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/oc get apiconnectcluster {{ apic_instance_name }}
          -n {{ apic_namespace }}
          -o jsonpath={.status.phase}
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: apic_phase
      until: apic_phase.stdout == "Ready"
      retries: 120
      delay: 30
      changed_when: false

    - name: "APIConnectCluster Ready!"
      ansible.builtin.debug:
        msg: "APIConnectCluster durumu: {{ apic_phase.stdout }} ✓"

    # ============================================================
    # ADIM 28 – Kurulum Doğrulama  (§7 SGK_v5)
    # ============================================================

    - name: "APIC tüm route'larını listele"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc get routes -n {{ apic_namespace }}"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: apic_routes
      changed_when: false

    - name: "APIC route'ları"
      ansible.builtin.debug:
        var: apic_routes.stdout_lines

    - name: "Cloud Manager admin şifresini al"
      ansible.builtin.shell: |
        SECRET=$(/usr/local/bin/oc get secret -n {{ apic_namespace }} \
          --no-headers -o custom-columns='NAME:.metadata.name' \
          | grep 'mgmt-admin-pass' | head -1)
        if [ -n "$SECRET" ]; then
          /usr/local/bin/oc get secret "$SECRET" \
            -n {{ apic_namespace }} \
            -o jsonpath="{.data.password}" | base64 -d
          echo ""
        else
          echo "Secret henüz oluşmadı – oc get secret -n {{ apic_namespace }} | grep mgmt-admin-pass ile kontrol edin"
        fi
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: apic_admin_pass
      changed_when: false
      no_log: false

    - name: "Cloud Manager erişim bilgileri"
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "APIC Kurulumu Tamamlandı!"
          - "============================================================"
          - "Route'ları görmek için:"
          - "  oc get routes -n {{ apic_namespace }}"
          - ""
          - "Cloud Manager URL: mgmt-admin-apic route'una bakın"
          - "Kullanıcı adı: admin"
          - "Şifre: {{ apic_admin_pass.stdout }}"
          - ""
          - "Toolkit indirmek için Cloud Manager veya API Manager UI'ı kullanın."
          - "============================================================"
