---
# ============================================================
#  OCP 4.20.17 – VMware IPI Tam Kurulum Playbook
#  Hedef: bastion host (RHEL 8)
#
#  Bu playbook tek başına çalıştırılır; ODF kurulumu
#  dosyanın sonundaki ikinci "play" olarak eklenmiştir.
#  Tüm süreci tek komutla çalıştırmak için:
#    ansible-playbook site.yml -i inventory/hosts.ini
# ============================================================
- name: "OCP 4.20.17 – Bastion Hazırlığı ve Kurulum"
  hosts: bastion
  become: true
  vars_files:
    - group_vars/all.yml

  # ============================================================
  # Pull Secret – interaktif girdi
  # ============================================================
  vars_prompt:
    - name: pull_secret
      prompt: >-
        Red Hat Pull Secret
        (https://console.redhat.com/openshift/install adresinden alın)
      private: true
      confirm: false

  pre_tasks:

    # ============================================================
    # PRE-TASK – /home/admin/vmware-ipi.yaml dosyasını oku
    # ============================================================
    - name: "vmware-ipi.yaml dosyasının varlığını kontrol et"
      ansible.builtin.stat:
        path: /home/admin/vmware-ipi.yaml
      register: vmware_ipi_stat

    - name: "vmware-ipi.yaml bulunamadı – playbook durduruluyor"
      ansible.builtin.fail:
        msg: >
          /home/admin/vmware-ipi.yaml dosyası bulunamadı.
          Dosyanın bastion host üzerinde mevcut olduğundan emin olun.
      when: not vmware_ipi_stat.stat.exists

    - name: "vmware-ipi.yaml dosyasını oku ve parse et"
      ansible.builtin.include_vars:
        file: /home/admin/vmware-ipi.yaml
        name: vmware_ipi

    - name: "vSphere değişkenlerini vmware-ipi.yaml'dan fact olarak kaydet"
      ansible.builtin.set_fact:
        vcenter_host:          "{{ vmware_ipi.vsphere_hostname }}"
        vcenter_username:      "{{ vmware_ipi.vsphere_username }}"
        vcenter_password:      "{{ vmware_ipi.vsphere_password }}"
        vcenter_datacenter:    "{{ vmware_ipi.vsphere_datacenter }}"
        vcenter_cluster:       "{{ vmware_ipi.vsphere_cluster }}"
        vcenter_network:       "{{ vmware_ipi.vsphere_network }}"
        vcenter_datastore:     "{{ vmware_ipi.vsphere_datastore }}"
        vcenter_resource_pool: "{{ vmware_ipi.vsphere_resource_pool }}"
        vcenter_folder:        "{{ vmware_ipi.vsphere_folder }}"
        vcenter_hostname:      "{{ vmware_ipi.vsphere_hostname }}"
        cluster_name:          "{{ vmware_ipi.cluster_name }}"
        base_domain:           "{{ vmware_ipi.base_domain }}"
        vsphere_api_vip:       "{{ vmware_ipi.vsphere_api_vip }}"
        vsphere_ingress_vip:   "{{ vmware_ipi.vsphere_ingress_vip }}"
        machine_network_cidr:  "192.168.252.0/24"
        cluster_dir:           "{{ install_base_dir }}/ocp4"

  tasks:

    # ============================================================
    # ADIM 2 – Kurulum dizinini oluştur ve dosyaları indir
    # ============================================================
    - name: "Kurulum dizinini oluştur: {{ install_base_dir }}"
      ansible.builtin.file:
        path: "{{ install_base_dir }}"
        state: directory
        mode: "0755"

    - name: "openshift-install tar.gz indir (wget)"
      ansible.builtin.command:
        cmd: >
          wget -q --show-progress
          {{ ocp_mirror_base }}/{{ ocp_version }}/{{ ocp_install_tarball }}
          -O {{ install_base_dir }}/{{ ocp_install_tarball }}
        creates: "{{ install_base_dir }}/{{ ocp_install_tarball }}"

    - name: "OCP client (standart) tar.gz indir (wget)"
      ansible.builtin.command:
        cmd: >
          wget -q --show-progress
          {{ ocp_mirror_base }}/{{ ocp_version }}/{{ ocp_client_tarball }}
          -O {{ install_base_dir }}/{{ ocp_client_tarball }}
        creates: "{{ install_base_dir }}/{{ ocp_client_tarball }}"

    - name: "openshift-install arşivini aç (tar -xvf)"
      ansible.builtin.command:
        cmd: "tar -xvf {{ install_base_dir }}/{{ ocp_install_tarball }}"
        chdir: "{{ install_base_dir }}"
      changed_when: true

    - name: "OCP client (standart) arşivini aç (tar -xvf)"
      ansible.builtin.command:
        cmd: "tar -xvf {{ install_base_dir }}/{{ ocp_client_tarball }}"
        chdir: "{{ install_base_dir }}"
      changed_when: true

    - name: "Standart oc binary'sini geçici olarak /usr/local/bin'e taşı"
      ansible.builtin.command:
        cmd: "mv {{ install_base_dir }}/oc {{ install_base_dir }}/kubectl /usr/local/bin/"
      changed_when: true
      failed_when: false

    - name: "oc binary GLIBC uyumluluğunu kontrol et"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc version --client"
      register: oc_glibc_check
      failed_when: false
      changed_when: false

    - name: "GLIBC uyumsuzluğu var mı?"
      ansible.builtin.set_fact:
        need_rhel8_client: "{{ 'GLIBC' in oc_glibc_check.stderr or oc_glibc_check.rc != 0 }}"

    # RHEL 8 uyumlu tarball – sadece GLIBC hatası varsa
    - name: "Standart oc/kubectl binary'lerini kaldır (RHEL 8 için)"
      ansible.builtin.command:
        cmd: "rm -f /usr/local/bin/oc /usr/local/bin/kubectl"
      when: need_rhel8_client
      changed_when: true

    - name: "RHEL 8 uyumlu OCP client tar.gz indir (wget)"
      ansible.builtin.command:
        cmd: >
          wget -q --show-progress
          {{ ocp_mirror_base }}/{{ ocp_version }}/{{ ocp_client_rhel8_tarball }}
          -O {{ install_base_dir }}/{{ ocp_client_rhel8_tarball }}
        creates: "{{ install_base_dir }}/{{ ocp_client_rhel8_tarball }}"
      when: need_rhel8_client

    - name: "RHEL 8 client için extract dizini oluştur"
      ansible.builtin.file:
        path: "{{ install_base_dir }}/rhel8-client"
        state: directory
        mode: "0755"
      when: need_rhel8_client

    - name: "RHEL 8 client arşivini aç (tar -xvf)"
      ansible.builtin.command:
        cmd: "tar -xvf {{ install_base_dir }}/{{ ocp_client_rhel8_tarball }}"
        chdir: "{{ install_base_dir }}/rhel8-client"
      when: need_rhel8_client
      changed_when: true

    - name: "RHEL 8 oc/kubectl binary'lerini /usr/local/bin'e taşı (mv)"
      ansible.builtin.command:
        cmd: "mv {{ install_base_dir }}/rhel8-client/oc {{ install_base_dir }}/rhel8-client/kubectl /usr/local/bin/"
      when: need_rhel8_client
      changed_when: true

    - name: "openshift-install binary'sini /usr/local/bin'e taşı (mv)"
      ansible.builtin.command:
        cmd: "mv {{ install_base_dir }}/openshift-install /usr/local/bin/openshift-install"
        creates: "/usr/local/bin/openshift-install"

    # ============================================================
    # ADIM 3 – Trusted Root CA sertifikası
    # ============================================================
    - name: "unzip paketi yüklü olduğundan emin ol"
      ansible.builtin.command:
        cmd: "yum install -y unzip"
      changed_when: false

    - name: "vCenter CA sertifika zip dosyasını indir (wget --no-check-certificate)"
      ansible.builtin.command:
        cmd: >
          wget --no-check-certificate
          https://{{ vcenter_hostname }}/certs/download.zip
          -O {{ install_base_dir }}/download.zip
        creates: "{{ install_base_dir }}/download.zip"

    - name: "CA sertifika zip dosyasını aç (unzip)"
      ansible.builtin.command:
        cmd: "unzip -o {{ install_base_dir }}/download.zip -d {{ install_base_dir }}"
      changed_when: true

    - name: "Linux CA sertifikalarını sistem güven deposuna kopyala (cp certs/lin/*)"
      ansible.builtin.command:
        cmd: "cp {{ install_base_dir }}/certs/lin/. /etc/pki/ca-trust/source/anchors/ -r"
      changed_when: true

    - name: "CA trust güncelle (update-ca-trust extract)"
      ansible.builtin.command:
        cmd: "update-ca-trust extract"
      changed_when: true

    # ============================================================
    # ADIM 4 – SSH Key Oluşturma
    # ============================================================
    - name: "SSH key zaten var mı kontrol et"
      ansible.builtin.stat:
        path: "{{ ssh_key_path }}"
      register: ssh_key_stat

    - name: "SSH key-pair oluştur (ssh-keygen -t ed25519 -N '')"
      ansible.builtin.command:
        cmd: "ssh-keygen -t ed25519 -N '' -f {{ ssh_key_path }}"
      when: not ssh_key_stat.stat.exists
      changed_when: true

    - name: "SSH agent'ı başlat ve key'i ekle (eval + ssh-add)"
      ansible.builtin.shell: |
        eval "$(ssh-agent -s)"
        ssh-add {{ ssh_key_path }}
      args:
        executable: /bin/bash
      changed_when: true

    - name: "Public key içeriğini oku (cat ~/.ssh/id_ed25519.pub)"
      ansible.builtin.slurp:
        src: "{{ ssh_key_path }}.pub"
      register: ssh_pub_key_b64

    - name: "SSH public key'i fact olarak kaydet"
      ansible.builtin.set_fact:
        ssh_public_key: "{{ ssh_pub_key_b64.content | b64decode | trim }}"

    # ============================================================
    # ADIM 5 – Sistem Hazırlığı
    # ============================================================
    - name: "Hostname doğrula ve ayarla"
      ansible.builtin.hostname:
        name: bastion

    - name: "SELinux'u devre dışı bırak (/etc/selinux/config)"
      ansible.builtin.lineinfile:
        path: /etc/selinux/config
        regexp: '^SELINUX='
        line: 'SELINUX=disabled'
        state: present

    - name: "Firewall servisini durdur (systemctl stop firewalld)"
      ansible.builtin.command:
        cmd: "systemctl stop firewalld"
      changed_when: true
      failed_when: false

    - name: "Firewall servisini devre dışı bırak (systemctl disable firewalld)"
      ansible.builtin.command:
        cmd: "systemctl disable firewalld"
      changed_when: true
      failed_when: false

    # ============================================================
    # ADIM 6 – Cluster Kurulum Dosyasının Oluşturulması
    # ============================================================
    - name: "ocp4 dizinini oluştur"
      ansible.builtin.file:
        path: "{{ cluster_dir }}"
        state: directory
        mode: "0755"

    - name: "install-config.yaml'ı oluştur (OCP 4.14+ failureDomains formatı)"
      ansible.builtin.copy:
        dest: "{{ cluster_dir }}/install-config.yaml"
        mode: "0600"
        content: |
          additionalTrustBundlePolicy: Proxyonly
          apiVersion: v1
          baseDomain: {{ base_domain }}
          compute:
          - architecture: amd64
            hyperthreading: Enabled
            name: worker
            platform:
              vsphere:
                cpus: {{ worker_cpus }}
                coresPerSocket: {{ worker_cores_per_socket }}
                memoryMB: {{ worker_memory_mb }}
                osDisk:
                  diskSizeGB: {{ worker_disk_gb }}
            replicas: {{ worker_replicas }}
          controlPlane:
            architecture: amd64
            hyperthreading: Enabled
            name: master
            platform:
              vsphere:
                cpus: {{ control_plane_cpus }}
                coresPerSocket: {{ control_plane_cores_per_socket }}
                memoryMB: {{ control_plane_memory_mb }}
                osDisk:
                  diskSizeGB: {{ control_plane_disk_gb }}
            replicas: {{ control_plane_replicas }}
          metadata:
            creationTimestamp: null
            name: {{ cluster_name }}
          networking:
            clusterNetwork:
            - cidr: {{ pod_network_cidr }}
              hostPrefix: {{ host_prefix }}
            machineNetwork:
            - cidr: 192.168.252.0/24
            networkType: OVNKubernetes
            serviceNetwork:
            - {{ service_network_cidr }}
          platform:
            vsphere:
              apiVIPs:
              - {{ vsphere_api_vip }}
              failureDomains:
              - name: generated-failure-domain
                region: generated-region
                server: {{ vcenter_host }}
                topology:
                  computeCluster: /{{ vcenter_datacenter }}/host/{{ vcenter_cluster }}
                  datacenter: {{ vcenter_datacenter }}
                  datastore: /{{ vcenter_datacenter }}/datastore/{{ vcenter_datastore }}
                  folder: {{ vcenter_folder }}
                  networks:
                  - {{ vcenter_network }}
                  resourcePool: {{ vcenter_resource_pool }}
                zone: generated-zone
              ingressVIPs:
              - {{ vsphere_ingress_vip }}
              vcenters:
              - datacenters:
                - {{ vcenter_datacenter }}
                password: {{ vcenter_password }}
                port: 443
                server: {{ vcenter_host }}
                user: {{ vcenter_username }}
          publish: External
          pullSecret: '{{ pull_secret }}'
          sshKey: '{{ ssh_public_key }}'

    - name: "Config yedeği al (cp ocp4/install-config.yaml install-config.yaml)"
      ansible.builtin.command:
        cmd: "cp {{ cluster_dir }}/install-config.yaml {{ install_base_dir }}/install-config.yaml"
      changed_when: true

    # ============================================================
    # ADIM 7 – Cluster kurulumunu başlat
    # ============================================================
    - name: "Cluster zaten kurulu mu kontrol et (auth/kubeconfig var mı?)"
      ansible.builtin.stat:
        path: "{{ cluster_dir }}/auth/kubeconfig"
      register: kubeconfig_stat

    - name: "OpenShift cluster kurulumunu başlat (~30-60 dk sürer)"
      ansible.builtin.command:
        cmd: "/usr/local/bin/openshift-install create cluster --dir {{ cluster_dir }} --log-level=info"
        chdir: "{{ install_base_dir }}"
      register: ocp_install_result
      changed_when: true
      when: not kubeconfig_stat.stat.exists
      async: 7200
      poll: 60

    # ============================================================
    # ADIM 8 – Cluster'a Erişim
    # ============================================================
    - name: "KUBECONFIG'i root .bashrc'ye ekle (export KUBECONFIG=...)"
      ansible.builtin.lineinfile:
        path: /root/.bashrc
        regexp: '^export KUBECONFIG='
        line: "export KUBECONFIG={{ cluster_dir }}/auth/kubeconfig"
        state: present
        create: true

    - name: "KUBECONFIG'i /etc/profile.d/kubeconfig.sh'e yaz (tüm shell'ler için)"
      ansible.builtin.copy:
        dest: /etc/profile.d/kubeconfig.sh
        content: "export KUBECONFIG={{ cluster_dir }}/auth/kubeconfig\n"
        mode: "0644"

    - name: "KUBECONFIG'i mevcut shell ortamına da ayarla"
      ansible.builtin.shell: |
        export KUBECONFIG={{ cluster_dir }}/auth/kubeconfig
        echo "export KUBECONFIG={{ cluster_dir }}/auth/kubeconfig" >> /root/.bash_profile
      args:
        executable: /bin/bash
      changed_when: false

    - name: "KUBECONFIG fact olarak kaydet"
      ansible.builtin.set_fact:
        kubeconfig_path: "{{ cluster_dir }}/auth/kubeconfig"

    # ============================================================
    # ADIM 9 – Infra MachineSet oluştur
    # ============================================================
    - name: "Worker MachineSet adını al (ilk worker machineset)"
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/oc get machinesets -n openshift-machine-api
          -o jsonpath='{.items[?(@.spec.template.metadata.labels.machine\.openshift\.io/cluster-api-machine-role=="worker")].metadata.name}'
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: worker_ms_name
      changed_when: false

    - name: "Worker MachineSet adını fact olarak kaydet"
      ansible.builtin.set_fact:
        worker_machineset_name: "{{ worker_ms_name.stdout.split()[0] }}"

    - name: "Worker MachineSet YAML'ını al (oc get machineset -o yaml)"
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/oc get machineset {{ worker_machineset_name }}
          -n openshift-machine-api -o yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: worker_ms_yaml_raw
      changed_when: false

    - name: "Worker MachineSet YAML'ını geçici dosyaya yaz"
      ansible.builtin.copy:
        dest: "{{ install_base_dir }}/worker-ms-raw.yaml"
        content: "{{ worker_ms_yaml_raw.stdout }}"
        mode: "0644"

    - name: "Python patch script'ini oluştur"
      ansible.builtin.copy:
        dest: "{{ install_base_dir }}/patch-infra-ms.py"
        mode: "0755"
        content: |
          import yaml

          with open("{{ install_base_dir }}/worker-ms-raw.yaml", "r") as f:
              ms = yaml.safe_load(f)

          ms_name = ms['metadata']['name']
          if '-worker' in ms_name:
              cluster_prefix = ms_name.split('-worker')[0]
          else:
              cluster_prefix = '-'.join(ms_name.split('-')[:-2])
          infra_name = cluster_prefix + '-infra-0'

          for field in ('managedFields', 'uid', 'resourceVersion', 'generation',
                        'creationTimestamp', 'finalizers'):
              ms['metadata'].pop(field, None)

          ms['metadata']['name']      = infra_name
          ms['metadata']['namespace'] = 'openshift-machine-api'
          ms['metadata']['annotations'] = {
              'machine.openshift.io/memoryMb': '{{ infra_memory_mb }}',
              'machine.openshift.io/vCPU':     '{{ infra_cpus }}'
          }
          cluster_id = ms['metadata'].get('labels', {}).get(
              'machine.openshift.io/cluster-api-cluster', cluster_prefix)
          ms['metadata']['labels'] = {
              'machine.openshift.io/cluster-api-cluster': cluster_id
          }

          ms['spec']['replicas'] = {{ infra_replicas }}
          ms['spec']['selector']['matchLabels']['machine.openshift.io/cluster-api-machineset'] = infra_name

          ms['spec']['template']['metadata']['labels'] = {
              'machine.openshift.io/cluster-api-cluster':      cluster_id,
              'machine.openshift.io/cluster-api-machine-role': 'infra',
              'machine.openshift.io/cluster-api-machine-type': 'infra',
              'machine.openshift.io/cluster-api-machineset':   infra_name,
          }

          ms['spec']['template']['spec'].setdefault('metadata', {})['labels'] = {
              'node-role.kubernetes.io/infra':              '',
              'cluster.ocs.openshift.io/openshift-storage': '',
          }
          ms['spec']['template']['spec']['lifecycleHooks'] = {}

          pv = ms['spec']['template']['spec']['providerSpec']['value']
          pv['numCPUs']           = {{ infra_cpus }}
          pv['numCoresPerSocket'] = {{ infra_cores_per_socket }}
          pv['memoryMiB']         = {{ infra_memory_mb }}
          pv['diskGiB']           = {{ infra_disk_gb }}
          pv.setdefault('workspace', {}).update({
              'resourcePool': '{{ vcenter_resource_pool }}',
              'folder':       '{{ vcenter_folder }}',
          })

          ms.pop('status', None)

          with open('{{ install_base_dir }}/machineset-infra.yaml', 'w') as f:
              yaml.dump(ms, f, default_flow_style=False, allow_unicode=True)

    - name: "Worker YAML'ını infra olarak düzenle (python3 patch)"
      ansible.builtin.command:
        cmd: "python3 {{ install_base_dir }}/patch-infra-ms.py"
      changed_when: true

    - name: "Infra MachineSet'i oluştur (oc create -f machineset-infra.yaml)"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc create -f {{ install_base_dir }}/machineset-infra.yaml"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: ms_create
      changed_when: "'created' in ms_create.stdout"
      failed_when:
        - ms_create.rc != 0
        - "'AlreadyExists' not in ms_create.stderr"

    - name: "Infra node'larının provisioning tamamlanmasını bekle (oc get machines -w)"
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/oc get machines -n openshift-machine-api
          -l machine.openshift.io/cluster-api-machine-role=infra
          -o jsonpath='{.items[*].status.phase}'
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: infra_machine_status
      until: >
        infra_machine_status.stdout.split() | length == infra_replicas | int
        and infra_machine_status.stdout.split() | unique == ['Running']
      retries: 60
      delay: 30
      changed_when: false

    # ============================================================
    # ADIM 10 – Ekstra Disk Ekleme ve Otomatik Python Yapılandırması
    # ============================================================
    - name: "ADIM 10 | VMware işlemleri için Python 3.11 paketini kur (RHEL 8 uyumlu)"
      ansible.builtin.package:
        name: python311
        state: present
      tags:
        - disk

    - name: "ADIM 10 | pyVmomi ve bağımlılıklarını pip3.11 ile kur"
      ansible.builtin.pip:
        name:
          - pyvmomi==9.1.0.0
          - requests>=2.31.0
        executable: pip3.11
      tags:
        - disk

    - name: "ADIM 10 | Sonraki VMware görevleri için Python Yorumlayıcısını güncelle"
      ansible.builtin.set_fact:
        ansible_python_interpreter: /usr/bin/python3.11
      tags:
        - disk

    - name: "ADIM 10 | Disk işlemi değişkenlerini yeniden yükle"
      ansible.builtin.include_vars:
        file: /home/admin/vmware-ipi.yaml
        name: disk_vmware_ipi
      tags:
        - disk

    - name: "ADIM 10 | Disk işlemi fact değişkenlerini oluştur"
      ansible.builtin.set_fact:
        vcenter_host: "{{ disk_vmware_ipi.vsphere_hostname }}"
        vcenter_hostname: "{{ disk_vmware_ipi.vsphere_hostname }}"
        vcenter_username: "{{ disk_vmware_ipi.vsphere_username }}"
        vcenter_password: "{{ disk_vmware_ipi.vsphere_password }}"
        vcenter_datacenter: "{{ disk_vmware_ipi.vsphere_datacenter }}"
        vcenter_cluster: "{{ disk_vmware_ipi.vsphere_cluster }}"
        vcenter_network: "{{ disk_vmware_ipi.vsphere_network }}"
        vcenter_datastore: "{{ disk_vmware_ipi.vsphere_datastore }}"
        vcenter_resource_pool: "{{ disk_vmware_ipi.vsphere_resource_pool }}"
        vcenter_folder: "{{ disk_vmware_ipi.vsphere_folder }}"
        cluster_name: "{{ disk_vmware_ipi.cluster_name }}"
        base_domain: "{{ disk_vmware_ipi.base_domain }}"
        cluster_dir: "{{ install_base_dir }}/ocp4"
        kubeconfig_path: "{{ install_base_dir }}/ocp4/auth/kubeconfig"
      no_log: true
      tags:
        - disk

    - name: "ADIM 10 | Infra Machine adlarını al"
      ansible.builtin.command:
        cmd: >-
          /usr/local/bin/oc get machines
          -n openshift-machine-api
          -l machine.openshift.io/cluster-api-machine-role=infra
          -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: infra_vm_names_raw
      changed_when: false
      tags:
        - disk

    - name: "ADIM 10 | Infra VM adlarını listeye dönüştür"
      ansible.builtin.set_fact:
        infra_vm_names: >-
          {{
            infra_vm_names_raw.stdout_lines
            | map('trim')
            | reject('equalto', '')
            | list
          }}
      tags:
        - disk

    - name: "ADIM 10 | Infra VM'leri guest shutdown ile kapat"
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ vcenter_host }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        folder: "{{ vcenter_folder }}"
        name: "{{ item }}"
        state: shutdown-guest
        state_change_timeout: 300
      loop: "{{ infra_vm_names }}"
      loop_control:
        label: "{{ item }}"
      no_log: true
      tags:
        - disk

    - name: "ADIM 10 | VM'lerin poweredOff olmasını bekle"
      community.vmware.vmware_guest_info:
        hostname: "{{ vcenter_host }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        datacenter: "{{ vcenter_datacenter }}"
        folder: "{{ vcenter_folder }}"
        name: "{{ item }}"
      loop: "{{ infra_vm_names }}"
      loop_control:
        label: "{{ item }}"
      register: disk_vm_poweroff_info
      until:
        - disk_vm_poweroff_info.instance is defined
        - disk_vm_poweroff_info.instance.hw_power_status == "poweredOff"
      retries: 20
      delay: 15
      changed_when: false
      no_log: true
      tags:
        - disk

    - name: "ADIM 10 | disk.EnableUUID ayarını etkinleştir"
      community.vmware.vmware_guest:
        hostname: "{{ vcenter_host }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        datacenter: "{{ vcenter_datacenter }}"
        folder: "{{ vcenter_folder }}"
        name: "{{ item }}"
        state: present
        advanced_settings:
          - key: disk.EnableUUID
            value: "TRUE"
      loop: "{{ infra_vm_names }}"
      loop_control:
        label: "{{ item }}"
      no_log: true
      tags:
        - disk

    - name: "ADIM 10 | Her infra VM'e ek disk ekle"
      community.vmware.vmware_guest_disk:
        hostname: "{{ vcenter_host }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        datacenter: "{{ vcenter_datacenter }}"
        folder: "{{ vcenter_folder }}"
        name: "{{ item }}"
        disk:
          - size_gb: "{{ infra_extra_disk_gb | int }}"
            type: thin
            datastore: "{{ vcenter_datastore }}"
            state: present
            scsi_controller: 0
            unit_number: 1
            scsi_type: paravirtual
            disk_mode: persistent
      loop: "{{ infra_vm_names }}"
      loop_control:
        label: "{{ item }}"
      register: disk_add_result
      no_log: true
      tags:
        - disk

    - name: "ADIM 10 | Infra VM'leri aç"
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ vcenter_host }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        folder: "{{ vcenter_folder }}"
        name: "{{ item }}"
        state: powered-on
      loop: "{{ infra_vm_names }}"
      loop_control:
        label: "{{ item }}"
      no_log: true
      tags:
        - disk

    - name: "ADIM 10 | VM'lerin poweredOn olmasını bekle"
      community.vmware.vmware_guest_info:
        hostname: "{{ vcenter_host }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        datacenter: "{{ vcenter_datacenter }}"
        folder: "{{ vcenter_folder }}"
        name: "{{ item }}"
      loop: "{{ infra_vm_names }}"
      loop_control:
        label: "{{ item }}"
      register: disk_vm_poweron_info
      until:
        - disk_vm_poweron_info.instance is defined
        - disk_vm_poweron_info.instance.hw_power_status == "poweredOn"
      retries: 20
      delay: 15
      changed_when: false
      no_log: true
      tags:
        - disk

    - name: "ADIM 10 | Infra node'ların Ready olmasını bekle"
      ansible.builtin.command:
        cmd: >-
          /usr/local/bin/oc get nodes
          -l node-role.kubernetes.io/infra
          -o jsonpath='{range .items[*]}{.metadata.name}{"="}{range .status.conditions[?(@.type=="Ready")]}{.status}{"\n"}{end}{end}'
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: infra_node_ready
      until:
        - infra_node_ready.stdout_lines | length == infra_replicas | int
        - infra_node_ready.stdout_lines | reject('search', '=True$') | list | length == 0
      retries: 40
      delay: 30
      changed_when: false
      tags:
        - disk

# ============================================================
#  OCP 4.x – ODF ve Local Storage Kurulumu Playbook
#  SGK_v5.docx Bölüm 4 (Adım 19-23) esas alınmıştır.
# ============================================================
- name: "OCP 4.x – OpenShift Data Foundation (ODF) Kurulumu"
  hosts: bastion
  become: true
  vars_files:
    - group_vars/all.yml
  vars:
    kubeconfig_path: "{{ install_base_dir }}/ocp4/auth/kubeconfig"

  tasks:

    # ============================================================
    # 1. Namespace ve OperatorGroup Oluşturma
    # ============================================================
    - name: "Local Storage ve ODF için Namespace'leri oluştur"
      ansible.builtin.shell: |
        cat <<EOF | /usr/local/bin/oc apply -f -
        apiVersion: v1
        kind: Namespace
        metadata:
          name: openshift-local-storage
        ---
        apiVersion: v1
        kind: Namespace
        metadata:
          name: openshift-storage
        ---
        apiVersion: operators.coreos.com/v1
        kind: OperatorGroup
        metadata:
          name: openshift-local-storage-operatorgroup
          namespace: openshift-local-storage
        spec:
          targetNamespaces:
          - openshift-local-storage
        ---
        apiVersion: operators.coreos.com/v1
        kind: OperatorGroup
        metadata:
          name: openshift-storage-operatorgroup
          namespace: openshift-storage
        spec:
          targetNamespaces:
          - openshift-storage
        EOF
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    # ============================================================
    # 2. Local Storage ve ODF Operatörlerinin Kurulması
    # ============================================================
    - name: "Operatör Subscription'larını oluştur (Automatic Approval)"
      ansible.builtin.shell: |
        cat <<EOF | /usr/local/bin/oc apply -f -
        apiVersion: operators.coreos.com/v1alpha1
        kind: Subscription
        metadata:
          name: local-storage-operator
          namespace: openshift-local-storage
        spec:
          channel: stable
          installPlanApproval: Automatic
          name: local-storage-operator
          source: redhat-operators
          sourceNamespace: openshift-marketplace
        ---
        apiVersion: operators.coreos.com/v1alpha1
        kind: Subscription
        metadata:
          name: odf-operator
          namespace: openshift-storage
        spec:
          channel: stable-4.20
          installPlanApproval: Automatic
          name: odf-operator
          source: redhat-operators
          sourceNamespace: openshift-marketplace
        EOF
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: "Operatörlerin ClusterServiceVersion (CSV) başarıyla yüklenmesini bekle"
      ansible.builtin.shell: |
        /usr/local/bin/oc get csv -n {{ item }} -o jsonpath='{.items[0].status.phase}'
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      loop:
        - openshift-local-storage
        - openshift-storage
      register: csv_status
      until: "csv_status.stdout == 'Succeeded'"
      retries: 30
      delay: 30
      changed_when: false

    # ============================================================
    # 3. Disk Tanıma Sorunu (Rotational) Çözümü
    # ============================================================
    - name: "Infra node isimlerini al"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc get nodes -l node-role.kubernetes.io/infra -o jsonpath='{.items[*].metadata.name}'"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: infra_nodes
      changed_when: false

    - name: "Infra VM adlarını listeye dönüştür (LocalVolumeSet için)"
      ansible.builtin.set_fact:
        infra_vm_names: "{{ infra_nodes.stdout.split() }}"

    - name: "Infra node'lardaki diskleri SSD (non-rotational) olarak işaretle (oc debug ile)"
      ansible.builtin.shell: >
        /usr/local/bin/oc debug node/{{ item }} -- chroot /host /bin/bash -c 
        "for disk in \$(ls /sys/block/ | grep -E '^sd|^vd|^nvme'); do 
        echo 'Changing /dev/\$disk to non-rotational'; 
        echo 0 > /sys/block/\$disk/queue/rotational; 
        done"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      loop: "{{ infra_vm_names }}"
      register: disk_fix
      changed_when: true

    - name: "Disk değişikliklerini görmesi için Local Storage podlarını yeniden başlat (CACHE TEMİZLEME)"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc delete pods --all -n openshift-local-storage"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    # ============================================================
    # 4. LocalVolumeSet Oluşturma
    # ============================================================
    - name: "LocalVolumeSet (local-block) kaynağını oluştur"
      ansible.builtin.shell: |
        cat <<EOF | /usr/local/bin/oc apply -f -
        apiVersion: local.storage.openshift.io/v1alpha1
        kind: LocalVolumeSet
        metadata:
          name: local-block
          namespace: openshift-local-storage
        spec:
          nodeSelector:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
        {% for node in infra_vm_names %}
                      - {{ node }}
        {% endfor %}
          storageClassName: local-block
          volumeMode: Block
          deviceInclusionSpec:
            deviceTypes:
              - disk
              - part
            minSize: 100Gi
          tolerations:
            - effect: NoSchedule
              key: node.ocs.openshift.io/storage
              operator: Equal
              value: "true"
            - effect: NoSchedule
              key: node-role.kubernetes.io/infra
              operator: Equal
              value: reserved
            - effect: NoExecute
              key: node-role.kubernetes.io/infra
              operator: Equal
              value: reserved
        EOF
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true

    - name: "Persistent Volume'ların (PV) oluşmasını bekle"
      ansible.builtin.shell: "/usr/local/bin/oc get pv -o custom-columns=NAME:.metadata.name,SC:.spec.storageClassName --no-headers | grep 'local-block' | wc -l"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: pv_check
      until: pv_check.stdout | int >= 3
      retries: 25
      delay: 15
      changed_when: false

    # ============================================================
    # 5. StorageCluster Oluşturma
    # ============================================================
    - name: "StorageCluster (ocs-storagecluster) kaynağını oluştur"
      ansible.builtin.shell: |
        cat <<EOF | /usr/local/bin/oc apply -f -
        apiVersion: ocs.openshift.io/v1
        kind: StorageCluster
        metadata:
          name: ocs-storagecluster
          namespace: openshift-storage
        spec:
          manageNodes: false
          storageDeviceSets:
            - count: 1
              replica: 3
              name: ocs-deviceset
              placement: {}
              portable: false
              resources: {}
              dataPVCTemplate:
                spec:
                  storageClassName: local-block
                  accessModes:
                    - ReadWriteOnce
                  volumeMode: Block
                  resources:
                    requests:
                      storage: 900Gi
        EOF
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true
    
    - name: "StorageCluster'ın Ready ve Healthy durumuna geçmesini bekle (~5-10 dk)"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc get storagecluster ocs-storagecluster -n openshift-storage -o jsonpath='{.status.phase}'"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: sc_status
      until: sc_status.stdout == 'Ready'
      retries: 40
      delay: 30
      changed_when: false

    # ============================================================
    # 6. Default Storage Class Değişikliği
    # ============================================================
    - name: "thin-csi storageclass'ından default annotation'ını kaldır"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc annotate sc thin-csi storageclass.kubernetes.io/is-default-class-"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true
      failed_when: false

    - name: "ocs-storagecluster-ceph-rbd storageclass'ını default olarak ayarla"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc annotate sc ocs-storagecluster-ceph-rbd storageclass.kubernetes.io/is-default-class=true --overwrite"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      changed_when: true
