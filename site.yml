---
# ============================================================
#  OCP 4.20.17 – VMware IPI Tam Kurulum Playbook
#  SGK_v5.docx Bölüm 2 ve 3 (Adım 1–17) birebir esas alınmıştır.
#  Hedef: bastion host (RHEL 8)
#
#  Bu playbook tek başına çalıştırılır; ODF kurulumu
#  plays/04_odf.yml içinde ayrı play olarak tanımlanmıştır.
#  Tüm süreci tek komutla çalıştırmak için:
#    ansible-playbook site.yml -i inventory/hosts.ini
# ============================================================
- name: "OCP 4.20.17 – Bastion Hazırlığı ve Kurulum"
  hosts: bastion
  become: true
  vars_files:
    - group_vars/all.yml

  # ============================================================
  # Pull Secret – interaktif girdi
  # Playbook başlarken terminal üzerinden sorulur; girilen değer
  # ekranda gösterilmez (private: true).
  # CI/CD ortamlarında: -e "pull_secret='...'" ile geçilebilir.
  # ============================================================
  vars_prompt:
    - name: pull_secret
      prompt: >-
        Red Hat Pull Secret
        (https://console.redhat.com/openshift/install adresinden alın)
      private: true
      confirm: false

  pre_tasks:

    # ============================================================
    # PRE-TASK – /home/admin/vmware-ipi.yaml dosyasını oku
    # ============================================================
    - name: "vmware-ipi.yaml dosyasının varlığını kontrol et"
      ansible.builtin.stat:
        path: /home/admin/vmware-ipi.yaml
      register: vmware_ipi_stat

    - name: "vmware-ipi.yaml bulunamadı – playbook durduruluyor"
      ansible.builtin.fail:
        msg: >
          /home/admin/vmware-ipi.yaml dosyası bulunamadı.
          Dosyanın bastion host üzerinde mevcut olduğundan emin olun.
      when: not vmware_ipi_stat.stat.exists

    - name: "vmware-ipi.yaml dosyasını oku ve parse et"
      ansible.builtin.include_vars:
        file: /home/admin/vmware-ipi.yaml
        name: vmware_ipi

    - name: "vSphere değişkenlerini vmware-ipi.yaml'dan fact olarak kaydet"
      ansible.builtin.set_fact:
        vcenter_host:          "{{ vmware_ipi.vsphere_hostname }}"
        vcenter_username:      "{{ vmware_ipi.vsphere_username }}"
        vcenter_password:      "{{ vmware_ipi.vsphere_password }}"
        vcenter_datacenter:    "{{ vmware_ipi.vsphere_datacenter }}"
        vcenter_cluster:       "{{ vmware_ipi.vsphere_cluster }}"
        vcenter_network:       "{{ vmware_ipi.vsphere_network }}"
        vcenter_datastore:     "{{ vmware_ipi.vsphere_datastore }}"
        vcenter_resource_pool: "{{ vmware_ipi.vsphere_resource_pool }}"
        vcenter_folder:        "{{ vmware_ipi.vsphere_folder }}"
        vcenter_hostname:      "{{ vmware_ipi.vsphere_hostname }}"
        cluster_name:          "{{ vmware_ipi.cluster_name }}"
        base_domain:           "{{ vmware_ipi.base_domain }}"
        vsphere_api_vip:       "{{ vmware_ipi.vsphere_api_vip }}"
        vsphere_ingress_vip:   "{{ vmware_ipi.vsphere_ingress_vip }}"
        machine_network_cidr:  "192.168.252.0/24"
        cluster_dir:           "{{ install_base_dir }}/ocp4"

    - name: "Okunan vSphere değişkenlerini göster (özet)"
      ansible.builtin.debug:
        msg:
          - "vCenter   : {{ vcenter_host }}"
          - "Datacenter: {{ vcenter_datacenter }}"
          - "Cluster   : {{ vcenter_cluster }}"
          - "Datastore : {{ vcenter_datastore }}"
          - "Network   : {{ vcenter_network }}"
          - "Folder    : {{ vcenter_folder }}"
          - "ResPool   : {{ vcenter_resource_pool }}"
          - "API VIP   : {{ vsphere_api_vip }}"
          - "Ingress   : {{ vsphere_ingress_vip }}"
          - "Cluster   : {{ cluster_name }}.{{ base_domain }}"
          - "MachNet   : {{ machine_network_cidr }}"

  tasks:

    # ============================================================
    # ADIM 1 – Root kullanıcısına geçiş  (§2.1)
    # Ansible become: true ile zaten root olarak çalışıyor.
    # ============================================================

    # ============================================================
    # ADIM 2 – Kurulum dizinini oluştur ve dosyaları indir  (§2.2)
    #
    # Döküman komutu:
    #   mkdir ocpinstall && cd ocpinstall
    #   wget <client-url>
    #   wget <install-url>
    #   tar -xvf openshift-client-linux-4.20.17.tar.gz
    #   tar -xvf openshift-install-linux-4.20.17.tar.gz
    #   mv oc kubectl openshift-install /usr/local/bin/
    #
    # RHEL 8 notu: OCP 4.20 standart oc/kubectl binary'leri
    # GLIBC 2.32+ gerektirir. RHEL 8'de bu sürüm yoktur.
    # Bu nedenle openshift-client-linux-amd64-rhel8 tarball'ı
    # kullanılır. Ref: https://access.redhat.com/solutions/7077895
    # ============================================================
    - name: "Kurulum dizinini oluştur: {{ install_base_dir }}"
      ansible.builtin.file:
        path: "{{ install_base_dir }}"
        state: directory
        mode: "0755"

    - name: "openshift-install tar.gz indir (wget)"
      ansible.builtin.command:
        cmd: >
          wget -q --show-progress
          {{ ocp_mirror_base }}/{{ ocp_version }}/{{ ocp_install_tarball }}
          -O {{ install_base_dir }}/{{ ocp_install_tarball }}
        creates: "{{ install_base_dir }}/{{ ocp_install_tarball }}"

    - name: "OCP client (standart) tar.gz indir (wget)"
      ansible.builtin.command:
        cmd: >
          wget -q --show-progress
          {{ ocp_mirror_base }}/{{ ocp_version }}/{{ ocp_client_tarball }}
          -O {{ install_base_dir }}/{{ ocp_client_tarball }}
        creates: "{{ install_base_dir }}/{{ ocp_client_tarball }}"

    - name: "openshift-install arşivini aç (tar -xvf)"
      ansible.builtin.command:
        cmd: "tar -xvf {{ install_base_dir }}/{{ ocp_install_tarball }}"
        chdir: "{{ install_base_dir }}"
      changed_when: true

    - name: "OCP client (standart) arşivini aç (tar -xvf)"
      ansible.builtin.command:
        cmd: "tar -xvf {{ install_base_dir }}/{{ ocp_client_tarball }}"
        chdir: "{{ install_base_dir }}"
      changed_when: true

    - name: "Standart oc binary'sini geçici olarak /usr/local/bin'e taşı"
      ansible.builtin.command:
        cmd: "mv {{ install_base_dir }}/oc {{ install_base_dir }}/kubectl /usr/local/bin/"
      changed_when: true
      failed_when: false  # RHEL 8'de GLIBC hatasıyla çalışmayabilir, devam et

    - name: "oc binary GLIBC uyumluluğunu kontrol et"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc version --client"
      register: oc_glibc_check
      failed_when: false
      changed_when: false

    - name: "GLIBC uyumsuzluğu var mı?"
      ansible.builtin.set_fact:
        need_rhel8_client: "{{ 'GLIBC' in oc_glibc_check.stderr or oc_glibc_check.rc != 0 }}"

    - name: "GLIBC durumunu göster"
      ansible.builtin.debug:
        msg: >-
          {% if need_rhel8_client %}
          GLIBC uyumsuzluğu tespit edildi – RHEL 8 uyumlu tarball indiriliyor.
          {% else %}
          Standart oc/kubectl uyumlu, ek işlem gerekmez.
          {% endif %}

    # RHEL 8 uyumlu tarball – sadece GLIBC hatası varsa
    - name: "Standart oc/kubectl binary'lerini kaldır (RHEL 8 için)"
      ansible.builtin.command:
        cmd: "rm -f /usr/local/bin/oc /usr/local/bin/kubectl"
      when: need_rhel8_client
      changed_when: true

    - name: "RHEL 8 uyumlu OCP client tar.gz indir (wget)"
      ansible.builtin.command:
        cmd: >
          wget -q --show-progress
          {{ ocp_mirror_base }}/{{ ocp_version }}/{{ ocp_client_rhel8_tarball }}
          -O {{ install_base_dir }}/{{ ocp_client_rhel8_tarball }}
        creates: "{{ install_base_dir }}/{{ ocp_client_rhel8_tarball }}"
      when: need_rhel8_client

    - name: "RHEL 8 client için extract dizini oluştur"
      ansible.builtin.file:
        path: "{{ install_base_dir }}/rhel8-client"
        state: directory
        mode: "0755"
      when: need_rhel8_client

    - name: "RHEL 8 client arşivini aç (tar -xvf)"
      ansible.builtin.command:
        cmd: "tar -xvf {{ install_base_dir }}/{{ ocp_client_rhel8_tarball }}"
        chdir: "{{ install_base_dir }}/rhel8-client"
      when: need_rhel8_client
      changed_when: true

    - name: "RHEL 8 oc/kubectl binary'lerini /usr/local/bin'e taşı (mv)"
      ansible.builtin.command:
        cmd: "mv {{ install_base_dir }}/rhel8-client/oc {{ install_base_dir }}/rhel8-client/kubectl /usr/local/bin/"
      when: need_rhel8_client
      changed_when: true

    - name: "openshift-install binary'sini /usr/local/bin'e taşı (mv)"
      ansible.builtin.command:
        cmd: "mv {{ install_base_dir }}/openshift-install /usr/local/bin/openshift-install"
        creates: "/usr/local/bin/openshift-install"

    - name: "oc versiyonunu doğrula"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc version --client"
      register: oc_version_final
      changed_when: false

    - name: "openshift-install versiyonunu doğrula"
      ansible.builtin.command:
        cmd: "/usr/local/bin/openshift-install version"
      register: ocp_install_version_final
      changed_when: false

    - name: "Binary versiyonlarını göster"
      ansible.builtin.debug:
        msg:
          - "{{ oc_version_final.stdout }}"
          - "{{ ocp_install_version_final.stdout_lines[0] }}"

    # ============================================================
    # ADIM 3 – Trusted Root CA sertifikası  (§2.3)
    #
    # Döküman komutu:
    #   wget --no-check-certificate \
    #     https://<vcenter>/certs/download.zip
    #   unzip download.zip
    #   cp certs/lin/* /etc/pki/ca-trust/source/anchors
    #   update-ca-trust extract
    # ============================================================
    - name: "unzip paketi yüklü olduğundan emin ol"
      ansible.builtin.command:
        cmd: "yum install -y unzip"
      changed_when: false

    - name: "vCenter CA sertifika zip dosyasını indir (wget --no-check-certificate)"
      ansible.builtin.command:
        cmd: >
          wget --no-check-certificate
          https://{{ vcenter_hostname }}/certs/download.zip
          -O {{ install_base_dir }}/download.zip
        creates: "{{ install_base_dir }}/download.zip"

    - name: "CA sertifika zip dosyasını aç (unzip)"
      ansible.builtin.command:
        cmd: "unzip -o {{ install_base_dir }}/download.zip -d {{ install_base_dir }}"
      changed_when: true

    - name: "Linux CA sertifikalarını sistem güven deposuna kopyala (cp certs/lin/*)"
      ansible.builtin.command:
        cmd: "cp {{ install_base_dir }}/certs/lin/. /etc/pki/ca-trust/source/anchors/ -r"
      changed_when: true

    - name: "CA trust güncelle (update-ca-trust extract)"
      ansible.builtin.command:
        cmd: "update-ca-trust extract"
      changed_when: true

    # ============================================================
    # ADIM 4 – SSH Key Oluşturma  (§2.4)
    #
    # Döküman komutu:
    #   ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519
    #   eval "$(ssh-agent -s)"
    #   ssh-add ~/.ssh/id_ed25519
    # ============================================================
    - name: "SSH key zaten var mı kontrol et"
      ansible.builtin.stat:
        path: "{{ ssh_key_path }}"
      register: ssh_key_stat

    - name: "SSH key-pair oluştur (ssh-keygen -t ed25519 -N '')"
      ansible.builtin.command:
        cmd: "ssh-keygen -t ed25519 -N '' -f {{ ssh_key_path }}"
      when: not ssh_key_stat.stat.exists
      changed_when: true

    - name: "SSH agent'ı başlat ve key'i ekle (eval + ssh-add)"
      ansible.builtin.shell: |
        eval "$(ssh-agent -s)"
        ssh-add {{ ssh_key_path }}
      args:
        executable: /bin/bash
      changed_when: true

    - name: "Public key içeriğini oku (cat ~/.ssh/id_ed25519.pub)"
      ansible.builtin.slurp:
        src: "{{ ssh_key_path }}.pub"
      register: ssh_pub_key_b64

    - name: "SSH public key'i fact olarak kaydet"
      ansible.builtin.set_fact:
        ssh_public_key: "{{ ssh_pub_key_b64.content | b64decode | trim }}"

    - name: "SSH public key'i göster"
      ansible.builtin.debug:
        msg: "SSH Public Key: {{ ssh_public_key }}"

    # ============================================================
    # ADIM 5 – Sistem Hazırlığı  (§2.5)
    #
    # Döküman komutu:
    #   hostname  (doğrulama)
    #   vi /etc/hostname  (gerekirse)
    #   vi /etc/selinux/config  → SELINUX=disabled
    #   systemctl stop firewalld
    #   systemctl disable firewalld
    #   systemctl status firewalld
    # ============================================================
    - name: "Hostname doğrula ve ayarla"
      ansible.builtin.hostname:
        name: bastion

    - name: "SELinux'u devre dışı bırak (/etc/selinux/config)"
      ansible.builtin.lineinfile:
        path: /etc/selinux/config
        regexp: '^SELINUX='
        line: 'SELINUX=disabled'
        state: present

    - name: "Firewall servisini durdur (systemctl stop firewalld)"
      ansible.builtin.command:
        cmd: "systemctl stop firewalld"
      changed_when: true
      failed_when: false

    - name: "Firewall servisini devre dışı bırak (systemctl disable firewalld)"
      ansible.builtin.command:
        cmd: "systemctl disable firewalld"
      changed_when: true
      failed_when: false

    - name: "Firewall servis durumunu göster (systemctl status firewalld)"
      ansible.builtin.command:
        cmd: "systemctl status firewalld"
      register: firewalld_status
      changed_when: false
      failed_when: false

    - name: "Firewalld durumu"
      ansible.builtin.debug:
        var: firewalld_status.stdout_lines

    # ============================================================
    # ADIM 6 – Cluster Kurulum Dosyasının Oluşturulması  (§2.6)
    #
    # Döküman akışı:
    #   1. openshift-install create install-config --dir=ocp4
    #      (sihirbaz çalışır, gerçek install-config.yaml oluşur)
    #   2. vi ocp4/install-config.yaml
    #      – compute/controlPlane boyutları güncellenir
    #      – machineNetwork, resourcePool, folder eklenir/düzeltilir
    #   3. cp ocp4/install-config.yaml install-config.yaml  (yedek)
    #
    # Ansible burada sihirbaza cevapları pipe ederek çalıştırır,
    # ardından oluşan gerçek YAML dosyasını python3 ile patch atar.
    # ============================================================
    - name: "ocp4 dizinini oluştur"
      ansible.builtin.file:
        path: "{{ cluster_dir }}"
        state: directory
        mode: "0755"

    # Sihirbaz SSH key sorusunu interaktif liste olarak soruyor,
    # pipe ile bypass edilemiyor (EOF hatası). Bu nedenle sihirbazın
    # ürettiği gerçek OCP 4.14+ formatını (failureDomains + vcenters)
    # baz alarak dosyayı direkt yazıyoruz.
    # Döküman §2.6 adım 12'deki vi düzenlemesi burada otomatik yapılıyor:
    #   - compute/controlPlane platform boyutları ekleniyor
    #   - machineNetwork 192.168.252.0/24 olarak düzeltiliyor
    #   - resourcePool tam yolu ekleniyor
    #   - folder ekleniyor (sihirbaz oluşturmuyor)
    - name: "install-config.yaml'ı oluştur (OCP 4.14+ failureDomains formatı)"
      ansible.builtin.copy:
        dest: "{{ cluster_dir }}/install-config.yaml"
        mode: "0600"
        content: |
          additionalTrustBundlePolicy: Proxyonly
          apiVersion: v1
          baseDomain: {{ base_domain }}
          compute:
          - architecture: amd64
            hyperthreading: Enabled
            name: worker
            platform:
              vsphere:
                cpus: {{ worker_cpus }}
                coresPerSocket: {{ worker_cores_per_socket }}
                memoryMB: {{ worker_memory_mb }}
                osDisk:
                  diskSizeGB: {{ worker_disk_gb }}
            replicas: {{ worker_replicas }}
          controlPlane:
            architecture: amd64
            hyperthreading: Enabled
            name: master
            platform:
              vsphere:
                cpus: {{ control_plane_cpus }}
                coresPerSocket: {{ control_plane_cores_per_socket }}
                memoryMB: {{ control_plane_memory_mb }}
                osDisk:
                  diskSizeGB: {{ control_plane_disk_gb }}
            replicas: {{ control_plane_replicas }}
          metadata:
            creationTimestamp: null
            name: {{ cluster_name }}
          networking:
            clusterNetwork:
            - cidr: {{ pod_network_cidr }}
              hostPrefix: {{ host_prefix }}
            machineNetwork:
            - cidr: 192.168.252.0/24
            networkType: OVNKubernetes
            serviceNetwork:
            - {{ service_network_cidr }}
          platform:
            vsphere:
              apiVIPs:
              - {{ vsphere_api_vip }}
              failureDomains:
              - name: generated-failure-domain
                region: generated-region
                server: {{ vcenter_host }}
                topology:
                  computeCluster: /{{ vcenter_datacenter }}/host/{{ vcenter_cluster }}
                  datacenter: {{ vcenter_datacenter }}
                  datastore: /{{ vcenter_datacenter }}/datastore/{{ vcenter_datastore }}
                  folder: {{ vcenter_folder }}
                  networks:
                  - {{ vcenter_network }}
                  resourcePool: {{ vcenter_resource_pool }}
                zone: generated-zone
              ingressVIPs:
              - {{ vsphere_ingress_vip }}
              vcenters:
              - datacenters:
                - {{ vcenter_datacenter }}
                password: {{ vcenter_password }}
                port: 443
                server: {{ vcenter_host }}
                user: {{ vcenter_username }}
          publish: External
          pullSecret: '{{ pull_secret }}'
          sshKey: '{{ ssh_public_key }}'

    - name: "install-config.yaml içeriğini göster (doğrulama)"
      ansible.builtin.command:
        cmd: "cat {{ cluster_dir }}/install-config.yaml"
      register: install_config_content
      changed_when: false

    - name: "install-config.yaml içeriği"
      ansible.builtin.debug:
        var: install_config_content.stdout_lines

    - name: "Config yedeği al (cp ocp4/install-config.yaml install-config.yaml)"
      ansible.builtin.command:
        cmd: "cp {{ cluster_dir }}/install-config.yaml {{ install_base_dir }}/install-config.yaml"
      changed_when: true

    # ============================================================
    # ADIM 7 – Cluster kurulumunu başlat  (§2.6, Adım 13)
    #
    # Döküman komutu:
    #   ./openshift-install create cluster --dir ./ocp4 --log-level=info
    # ============================================================
    - name: "Cluster zaten kurulu mu kontrol et (auth/kubeconfig var mı?)"
      ansible.builtin.stat:
        path: "{{ cluster_dir }}/auth/kubeconfig"
      register: kubeconfig_stat

    - name: "OpenShift cluster kurulumunu başlat (~30-60 dk sürer)"
      ansible.builtin.command:
        cmd: "/usr/local/bin/openshift-install create cluster --dir {{ cluster_dir }} --log-level=info"
        chdir: "{{ install_base_dir }}"
      register: ocp_install_result
      changed_when: true
      when: not kubeconfig_stat.stat.exists
      async: 7200
      poll: 60

    - name: "Kurulum çıktısını göster"
      ansible.builtin.debug:
        var: ocp_install_result.stdout_lines

    # ============================================================
    # ADIM 8 – Cluster'a Erişim  (§2.7)
    #
    # Döküman komutu:
    #   export KUBECONFIG=ocp4/auth/kubeconfig
    # ============================================================
    - name: "KUBECONFIG'i root .bashrc'ye ekle (export KUBECONFIG=...)"
      ansible.builtin.lineinfile:
        path: /root/.bashrc
        regexp: '^export KUBECONFIG='
        line: "export KUBECONFIG={{ cluster_dir }}/auth/kubeconfig"
        state: present
        create: true

    - name: "KUBECONFIG'i /etc/profile.d/kubeconfig.sh'e yaz (tüm shell'ler için)"
      ansible.builtin.copy:
        dest: /etc/profile.d/kubeconfig.sh
        content: "export KUBECONFIG={{ cluster_dir }}/auth/kubeconfig\n"
        mode: "0644"

    - name: "KUBECONFIG'i mevcut shell ortamına da ayarla"
      ansible.builtin.shell: |
        export KUBECONFIG={{ cluster_dir }}/auth/kubeconfig
        echo "export KUBECONFIG={{ cluster_dir }}/auth/kubeconfig" >> /root/.bash_profile
      args:
        executable: /bin/bash
      changed_when: false

    - name: "KUBECONFIG fact olarak kaydet"
      ansible.builtin.set_fact:
        kubeconfig_path: "{{ cluster_dir }}/auth/kubeconfig"

    - name: "Cluster node'larını listele (oc get nodes)"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc get nodes"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: node_list
      changed_when: false

    - name: "Node listesi"
      ansible.builtin.debug:
        var: node_list.stdout_lines

    # ============================================================
    # ADIM 9 – Infra MachineSet oluştur  (§3.1)
    #
    # Döküman komutu:
    #   oc get machinesets <worker-ms-adı> -n openshift-machine-api -o yaml > machineset-infra.yaml
    #   vi machineset-infra.yaml   (infra role/labels + boyutlar)
    #   oc create -f machineset-infra.yaml
    #   oc get machines -n openshift-machine-api -w
    #
    # Önemli: template alanı (örn. ocpinstall-7smbl-rhcos-generated-failure-domain)
    # kurulum sonrası belli olur, önceden yazılamaz. Bu nedenle worker machineset'in
    # YAML'ı cluster'dan alınıp python3 ile patch edilir — dökümanın vi adımı budur.
    # ============================================================
    - name: "Mevcut worker machinesetleri listele (oc get machinesets)"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc get machinesets -n openshift-machine-api"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: machinesets_list
      changed_when: false

    - name: "MachineSet listesi"
      ansible.builtin.debug:
        var: machinesets_list.stdout_lines

    - name: "Worker MachineSet adını al (ilk worker machineset)"
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/oc get machinesets -n openshift-machine-api
          -o jsonpath='{.items[?(@.spec.template.metadata.labels.machine\.openshift\.io/cluster-api-machine-role=="worker")].metadata.name}'
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: worker_ms_name
      changed_when: false

    - name: "Worker MachineSet adını fact olarak kaydet"
      ansible.builtin.set_fact:
        worker_machineset_name: "{{ worker_ms_name.stdout.split()[0] }}"

    - name: "Worker MachineSet adını göster"
      ansible.builtin.debug:
        msg: "Worker MachineSet: {{ worker_machineset_name }}"

    - name: "Worker MachineSet YAML'ını al (oc get machineset -o yaml)"
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/oc get machineset {{ worker_machineset_name }}
          -n openshift-machine-api -o yaml
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: worker_ms_yaml_raw
      changed_when: false

    # Döküman §3.1: worker YAML'ı alıp infra olarak düzenleme (vi adımı)
    # python3 ile:
    #   - metadata temizlenir (managedFields, uid, resourceVersion, creationTimestamp)
    #   - name: <infra-id>-infra-0 yapılır
    #   - role/type label'ları infra yapılır
    #   - node-role infra label'ı eklenir
    #   - cluster.ocs.openshift.io/openshift-storage label'ı eklenir (ODF için)
    #   - lifecycleHooks: {} eklenir
    #   - replicas infra_replicas yapılır
    #   - numCPUs, numCoresPerSocket, memoryMiB, diskGiB güncellenir
    #   - annotations (memoryMb, vCPU) güncellenir
    #   - resourcePool ve folder vmware-ipi.yaml'dan gelen değerlerle güncellenir
    # Worker YAML'ını önce geçici dosyaya yaz
    - name: "Worker MachineSet YAML'ını geçici dosyaya yaz"
      ansible.builtin.copy:
        dest: "{{ install_base_dir }}/worker-ms-raw.yaml"
        content: "{{ worker_ms_yaml_raw.stdout }}"
        mode: "0644"

    # Python script'ini Ansible değişkenleriyle doldurarak dosyaya yaz
    - name: "Python patch script'ini oluştur"
      ansible.builtin.copy:
        dest: "{{ install_base_dir }}/patch-infra-ms.py"
        mode: "0755"
        content: |
          import yaml

          with open("{{ install_base_dir }}/worker-ms-raw.yaml", "r") as f:
              ms = yaml.safe_load(f)

          # cluster prefix'i al: ocpinstall-7smbl-worker-0 → ocpinstall-7smbl
          ms_name = ms['metadata']['name']
          if '-worker' in ms_name:
              cluster_prefix = ms_name.split('-worker')[0]
          else:
              cluster_prefix = '-'.join(ms_name.split('-')[:-2])
          infra_name = cluster_prefix + '-infra-0'

          # metadata temizle
          for field in ('managedFields', 'uid', 'resourceVersion', 'generation',
                        'creationTimestamp', 'finalizers'):
              ms['metadata'].pop(field, None)

          ms['metadata']['name']      = infra_name
          ms['metadata']['namespace'] = 'openshift-machine-api'
          ms['metadata']['annotations'] = {
              'machine.openshift.io/memoryMb': '{{ infra_memory_mb }}',
              'machine.openshift.io/vCPU':     '{{ infra_cpus }}'
          }
          cluster_id = ms['metadata'].get('labels', {}).get(
              'machine.openshift.io/cluster-api-cluster', cluster_prefix)
          ms['metadata']['labels'] = {
              'machine.openshift.io/cluster-api-cluster': cluster_id
          }

          # spec
          ms['spec']['replicas'] = {{ infra_replicas }}
          ms['spec']['selector']['matchLabels']['machine.openshift.io/cluster-api-machineset'] = infra_name

          # template metadata labels — worker'ı infra yap
          ms['spec']['template']['metadata']['labels'] = {
              'machine.openshift.io/cluster-api-cluster':      cluster_id,
              'machine.openshift.io/cluster-api-machine-role': 'infra',
              'machine.openshift.io/cluster-api-machine-type': 'infra',
              'machine.openshift.io/cluster-api-machineset':   infra_name,
          }

          # node role labels — sadece infra (worker yok)
          ms['spec']['template']['spec'].setdefault('metadata', {})['labels'] = {
              'node-role.kubernetes.io/infra':              '',
              'cluster.ocs.openshift.io/openshift-storage': '',
          }
          ms['spec']['template']['spec']['lifecycleHooks'] = {}

          # providerSpec değerleri
          pv = ms['spec']['template']['spec']['providerSpec']['value']
          pv['numCPUs']           = {{ infra_cpus }}
          pv['numCoresPerSocket'] = {{ infra_cores_per_socket }}
          pv['memoryMiB']         = {{ infra_memory_mb }}
          pv['diskGiB']           = {{ infra_disk_gb }}
          pv.setdefault('workspace', {}).update({
              'resourcePool': '{{ vcenter_resource_pool }}',
              'folder':       '{{ vcenter_folder }}',
          })

          ms.pop('status', None)

          with open('{{ install_base_dir }}/machineset-infra.yaml', 'w') as f:
              yaml.dump(ms, f, default_flow_style=False, allow_unicode=True)

          print("machineset-infra.yaml olusturuldu: " + infra_name)

    - name: "Worker YAML'ını infra olarak düzenle (python3 patch)"
      ansible.builtin.command:
        cmd: "python3 {{ install_base_dir }}/patch-infra-ms.py"
      changed_when: true

    - name: "Oluşturulan machineset-infra.yaml içeriğini göster"
      ansible.builtin.command:
        cmd: "cat {{ install_base_dir }}/machineset-infra.yaml"
      register: ms_infra_content
      changed_when: false

    - name: "machineset-infra.yaml içeriği"
      ansible.builtin.debug:
        var: ms_infra_content.stdout_lines

    - name: "Infra MachineSet'i oluştur (oc create -f machineset-infra.yaml)"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc create -f {{ install_base_dir }}/machineset-infra.yaml"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: ms_create
      changed_when: "'created' in ms_create.stdout"
      failed_when:
        - ms_create.rc != 0
        - "'AlreadyExists' not in ms_create.stderr"

    - name: "MachineSet oluşturma sonucu"
      ansible.builtin.debug:
        var: ms_create.stdout

    - name: "Infra node'larının provisioning tamamlanmasını bekle (oc get machines -w)"
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/oc get machines -n openshift-machine-api
          -l machine.openshift.io/cluster-api-machine-role=infra
          -o jsonpath='{.items[*].status.phase}'
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: infra_machine_status
      until: >
        infra_machine_status.stdout.split() | length == infra_replicas | int
        and infra_machine_status.stdout.split() | unique == ['Running']
      retries: 60
      delay: 30
      changed_when: false

    - name: "Infra node'larını doğrula"
      ansible.builtin.command:
        cmd: "/usr/local/bin/oc get nodes -l node-role.kubernetes.io/infra"
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: infra_nodes
      changed_when: false

    - name: "Infra node listesi"
      ansible.builtin.debug:
        var: infra_nodes.stdout_lines



    # ============================================================
    # ADIM 10 – Ekstra Disk Ekleme (§3.2 SGK_v5)
    #
    # community.vmware.vmware_guest_disk modülü ile her infra
    # node'una otomatik olarak 1 TB disk eklenir.
    #
    # Gereksinimler (bastion host üzerinde):
    #   pip install pyVmomi
    #   ansible-galaxy collection install community.vmware
    # ============================================================

    - name: "pyVmomi kurulu olduğundan emin ol (community.vmware gereksinimi)"
      ansible.builtin.pip:
        name: pyVmomi
        state: present

    - name: "Infra Machine'lerin VMware providerID'lerini al"
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/oc get machines -n openshift-machine-api
          -l machine.openshift.io/cluster-api-machine-role=infra
          -o jsonpath='{.items[*].spec.providerSpec.value.template}'
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: infra_vm_templates_raw
      changed_when: false

    # OCP IPI, VM'leri "<cluster_name>-<id>-infra-<n>" adıyla oluşturur.
    # Machine nesnelerinin metadata.name alanı doğrudan VMware VM adıdır.
    - name: "Infra Machine adlarını (= VMware VM adları) al"
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/oc get machines -n openshift-machine-api
          -l machine.openshift.io/cluster-api-machine-role=infra
          -o jsonpath='{.items[*].metadata.name}'
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: infra_vm_names_raw
      changed_when: false

    - name: "Infra VM adlarını listeye dönüştür"
      ansible.builtin.set_fact:
        infra_vm_names: "{{ infra_vm_names_raw.stdout.split() }}"

    - name: "Infra VM listesi"
      ansible.builtin.debug:
        msg: "Disk eklenecek VM'ler: {{ infra_vm_names }}"

    - name: "Her infra VM'ini kapat (Shut Down Guest OS)"
      community.vmware.vmware_guest_powerstate:
        hostname:       "{{ vcenter_host }}"
        username:       "{{ vcenter_username }}"
        password:       "{{ vcenter_password }}"
        validate_certs: false
        datacenter:     "{{ vcenter_datacenter }}"
        folder:         "{{ vcenter_folder }}"
        name:           "{{ item }}"
        state:          shutdown-guest
      loop: "{{ infra_vm_names }}"
      loop_control:
        label: "{{ item }}"

    - name: "VM'lerin tamamen kapanmasını bekle (PoweredOff)"
      community.vmware.vmware_guest_info:
        hostname:       "{{ vcenter_host }}"
        username:       "{{ vcenter_username }}"
        password:       "{{ vcenter_password }}"
        validate_certs: false
        datacenter:     "{{ vcenter_datacenter }}"
        name:           "{{ item }}"
      register: vm_info
      until: vm_info.instance.hw_power_status == 'poweredOff'
      retries: 20
      delay: 15
      loop: "{{ infra_vm_names }}"
      loop_control:
        label: "{{ item }}"
      changed_when: false

    - name: "Her infra VM'ine {{ infra_extra_disk_gb }} GB disk ekle"
      community.vmware.vmware_guest_disk:
        hostname:       "{{ vcenter_host }}"
        username:       "{{ vcenter_username }}"
        password:       "{{ vcenter_password }}"
        validate_certs: false
        datacenter:     "{{ vcenter_datacenter }}"
        folder:         "{{ vcenter_folder }}"
        name:           "{{ item }}"
        disk:
          - size_gb:    "{{ infra_extra_disk_gb }}"
            type:       thin
            datastore:  "{{ vcenter_datastore }}"
            state:      present
            scsi_type:  paravirtual
      loop: "{{ infra_vm_names }}"
      loop_control:
        label: "{{ item }}"

    - name: "Her infra VM'ini yeniden başlat (power-on)"
      community.vmware.vmware_guest_powerstate:
        hostname:       "{{ vcenter_host }}"
        username:       "{{ vcenter_username }}"
        password:       "{{ vcenter_password }}"
        validate_certs: false
        datacenter:     "{{ vcenter_datacenter }}"
        folder:         "{{ vcenter_folder }}"
        name:           "{{ item }}"
        state:          powered-on
      loop: "{{ infra_vm_names }}"
      loop_control:
        label: "{{ item }}"

    - name: "Infra node'larının tekrar Ready olmasını bekle (disk ekleme sonrası)"
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/oc get nodes
          -l node-role.kubernetes.io/infra
          -o jsonpath='{.items[*].status.conditions[-1].type}'
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      register: infra_node_ready
      until: >
        infra_node_ready.stdout.split() | length == infra_replicas | int
        and infra_node_ready.stdout.split() | unique == ['Ready']
      retries: 40
      delay: 30
      changed_when: false

    - name: "Disk ekleme tamamlandı"
      ansible.builtin.debug:
        msg: >-
          {{ infra_vm_names | length }} infra node'una {{ infra_extra_disk_gb }} GB
          disk eklendi ve tüm node'lar Ready durumuna geçti.

# ============================================================
# BÖLÜM 4 – ODF ve Local Storage Operator Kurulumu (§4 SGK_v5)
# plays/04_odf.yml içinde tanımlanmıştır.
# ============================================================
- import_playbook: plays/04_odf.yml
