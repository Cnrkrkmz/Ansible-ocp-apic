# ============================================================
#  OCP 4.20.17 – VMware IPI Kurulum Değişkenleri
#  SGK_v4.docx dokümanı esas alınarak hazırlanmıştır.
#
#  NOT: Aşağıdaki vSphere / cluster değişkenleri playbook
#  çalışırken /home/admin/vmware-ipi.yaml dosyasından
#  otomatik olarak okunur. Buraya girmenize gerek yoktur:
#    vcenter_host, vcenter_username, vcenter_password,
#    vcenter_datacenter, vcenter_cluster, vcenter_network,
#    vcenter_datastore, vcenter_resource_pool, vcenter_folder,
#    cluster_name, base_domain,
#    vsphere_api_vip, vsphere_ingress_vip
# ============================================================

# ---- OCP Versiyon ----
ocp_version: "4.20.17"
ocp_mirror_base: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp"
ocp_client_tarball:       "openshift-client-linux-{{ ocp_version }}.tar.gz"
ocp_client_rhel8_tarball: "openshift-client-linux-amd64-rhel8-{{ ocp_version }}.tar.gz"
ocp_install_tarball:      "openshift-install-linux-{{ ocp_version }}.tar.gz"

# ---- Dizinler ----
install_base_dir: "/root/ocpinstall"
# cluster_dir pre_tasks'ta dinamik olarak set edilir

# ---- Pull Secret ----
# https://console.redhat.com/openshift/install adresinden indirin.
#
# Bu değeri ASLA bu dosyaya yazmayın.
# Aşağıdaki yöntemlerden birini kullanın:
#
#   1) Playbook çalışırken interaktif olarak girin (varsayılan):
#        ansible-playbook site.yml -i inventory/hosts.ini
#      Playbook, pull_secret değerini sizden otomatik olarak sorar.
#
#   2) Komut satırından geçirin (CI/CD ortamları için):
#        ansible-playbook site.yml -i inventory/hosts.ini \
#          -e "pull_secret='<içeriği buraya yapıştırın>'"
#
#   3) Ansible Vault ile şifreli değişken dosyası kullanın:
#        ansible-vault encrypt_string '<pull_secret>' --name pull_secret >> group_vars/vault.yml
#        ansible-playbook site.yml -i inventory/hosts.ini --ask-vault-pass
#
# pull_secret bu dosyada tanımlı DEĞİLDİR; site.yml vars_prompt üzerinden alınır.
# ---- SSH Public Key (otomatik oluşturulacak) ----
ssh_key_path: "/root/.ssh/id_ed25519"

# ---- Machine Network (sabit – her zaman bu değer kullanılır) ----
machine_network_cidr: "192.168.252.0/24"
host_prefix: 23

# ---- Service & Pod Network ----
service_network_cidr: "172.30.0.0/16"
pod_network_cidr: "10.128.0.0/14"

# ---- Control Plane Boyutlandırma (§2.6 SGK_v4) ----
control_plane_replicas: 3
control_plane_cpus: 8
control_plane_cores_per_socket: 2
control_plane_memory_mb: 16384
control_plane_disk_gb: 120

# ---- Worker Boyutlandırma (§2.6 SGK_v4) ----
worker_replicas: 3
worker_cpus: 16
worker_cores_per_socket: 2
worker_memory_mb: 32768
worker_disk_gb: 300

# ---- Infra MachineSet Boyutlandırma (§3.1 SGK_v5) ----
infra_replicas: 3
infra_cpus: 32
infra_cores_per_socket: 2
infra_memory_mb: 32768
infra_disk_gb: 300

# ---- Infra Ekstra Disk (§3.2 SGK_v5) ----
# Her infra node'una eklenecek ODF diski (GB cinsinden)
infra_extra_disk_gb: 1024

# ---- ODF / Local Storage Operator (§4 SGK_v5) ----
# Operatör kanalları – OCP 4.20 ile uyumlu sürümler
odf_channel: "stable-4.16"      # ODF stable kanalı (OCP 4.20 ile uyumlu)
lso_channel: "stable-4.16"      # Local Storage Operator kanalı

# StorageCluster için disk boyutu (her infra node'daki ek diskin boyutu)
odf_disk_size: "1Ti"

# LocalVolumeSet PV beklemesi – en az bu kadar PV oluşmalı (3 node × 1 disk)
odf_pv_minimum: 3


# ---- APIC Kurulumu (§5-7 SGK_v5) ----
#
# apic_entitlement_key: IBM Entitlement Key
#   https://myibm.ibm.com/products-services/containerlibrary adresinden alın.
#   Bu değeri buraya YAZMAYIN; playbook çalışırken sorulur (vars_prompt)
#   veya -e "apic_entitlement_key=<key>" ile geçirin.
#   Vault kullanımı önerilir:
#     ansible-vault encrypt_string '<key>' --name apic_entitlement_key >> group_vars/vault.yml

# APIC kurulumu yapılacak namespace
apic_namespace: "apic"

# APIConnectCluster CR ismi
apic_instance_name: "apic"

# Deployment profile
#   n1xc17.m48  – nonproduction small (3 worker node için minimum)
#   n3xc16.m64  – production minimum
#   n3xc32.m96  – production standart
apic_profile: "n1xc17.m48"

# License bilgileri
# License ID listesi: https://ibm.github.io/cloud-pak/assets/html/ibm-apiconnect-table.html
apic_license_id: "L-MMBZ-295QZQ"       # API Connect nonproduction lisansı
apic_license_use: "nonproduction"       # production veya nonproduction
apic_license_metric: "PROCESSOR_VALUE_UNIT"

# StorageClass – ODF hazırsa ocs-storagecluster-ceph-rbd, yoksa thin-csi
apic_storage_class: "thin-csi"

# ibm-apiconnect operatör channel'ı
apic_catalog_channel: "v10.0"

# Operatörün kurulacağı namespace (cluster-wide için openshift-operators önerilir)
apic_operator_namespace: "openshift-operators"

# InstallPlan onay modu – Manual veya Automatic
apic_install_plan_approval: "Manual"
