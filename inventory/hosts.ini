# ============================================================
# Senaryo A – Ansible BASTION ÜZERİNDE çalışıyorsa (önerilen)
#   Bastion'a giriş yap, playbook'u oradan çalıştır.
#   SSH'a gerek kalmaz, direkt local bağlantı kullanılır.
# ============================================================
[bastion]
bastion ansible_host=127.0.0.1 ansible_connection=local ansible_user=root

# ============================================================
# Senaryo B – Ansible KENDİ BİLGİSAYARINDA kuruluysa
#   Kendi laptopundan bastiona SSH ile bağlanarak çalıştır.
#   Aşağıdaki satırı yorumdan çıkar, Senaryo A satırını yorum yap.
# ============================================================
# [bastion]
# bastion ansible_host=192.168.252.2 ansible_user=root
# ansible_ssh_private_key_file=~/.ssh/id_rsa   # gerekirse ekle

